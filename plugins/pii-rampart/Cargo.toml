[package]
name = "nemo-relay-pii-rampart-plugin"
version = "0.8.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Opt-in native Rampart PII redaction plugin for NeMo Relay"

[workspace]

[lib]
name = "nemo_relay_pii_rampart_plugin"
crate-type = ["cdylib"]

[dependencies]
nemo-relay = { path = "../../crates/core" }
nemo-relay-pii-redaction = { path = "../../crates/pii-redaction", features = ["rampart"] }
nemo-relay-plugin = { path = "../../crates/plugin" }
serde_json = "1"

[dev-dependencies]
jsonschema = "0.46.8"
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
