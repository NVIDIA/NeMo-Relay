[package]
name = "nemo-relay-daemon-transport-benchmark"
version.workspace = true
license.workspace = true
edition = "2024"
publish = false

[dependencies]
anyhow.workspace = true
async-stream.workspace = true
base64.workspace = true
bytes.workspace = true
clap = { workspace = true, features = ["derive"] }
const-hex.workspace = true
hdrhistogram.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "server", "http1", "http2"] }
hyper-rustls = { workspace = true, features = ["http1", "http2", "native-tokio", "ring", "tls12"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "http2", "server-auto", "tokio"] }
ring.workspace = true
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, default-features = true, features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml.workspace = true
tower-service.workspace = true

[lints.rust]
unsafe_code = "forbid"
