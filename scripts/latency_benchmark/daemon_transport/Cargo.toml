[package]
name = "nemo-relay-daemon-transport-benchmark"
version.workspace = true
license.workspace = true
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
async-stream = "0.3"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
const-hex = "1"
hdrhistogram = "7"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "native-tokio", "ring", "tls12"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "server-auto", "tokio"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9"
tower-service = "0.3"

[lints.rust]
unsafe_code = "forbid"
