instances:
- url: nvidia-nemo-relay.docs.buildwithfern.com/nemo/relay
  custom-domain: docs.nvidia.com/nemo/relay
  multi-source: true

title: NVIDIA NeMo Relay

agents:
  llms-txt: ./llms.txt
  page-directive: >-
    For clean Markdown of any page, append .md to the page URL.
    For a task-oriented documentation index, fetch https://docs.nvidia.com/nemo/relay/llms.txt.
    Use the documentation version matching the installed NeMo Relay package:
    latest follows the latest stable release, vX.Y.Z identifies a retained release snapshot,
    and dev documents development changes. Preserve the selected version when following links;
    do not mix examples or API contracts from different versions.
    Fetch the relevant section's /llms.txt before individual pages instead of loading a complete version index.

navbar-links:
- type: github
  value: https://github.com/NVIDIA/NeMo-Relay

global-theme: nvidia

announcement:
  message: "🔔 NVIDIA NeMo Relay is <strong>beta software</strong>. APIs and behavior may change with each release."

redirects:
- ./redirects/legacy.yml
- ./redirects/rust-reference.yml

experimental:
  mdx-components:
  - ./components

products:
- display-name: "NeMo Relay"
  slug: /
  path: ../docs/index.yml
  versions:
  - display-name: dev
    path: ../docs/index.yml
