[package]
name = "nemo-relay-model-pricing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Model pricing catalogs and cost estimation for NeMo Relay."

[lints]
workspace = true

[features]
default = []
__test-support = []
schema = ["dep:schemars", "nemo-relay-types/schema"]

[dependencies]
nemo-relay-plugin.workspace = true
log = { workspace = true, features = ["kv", "kv_serde"] }
nemo-relay-types.workspace = true
schemars = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
