[package]
name = "nemo-relay-switchyard"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "First-party in-process Switchyard libsy routing plugin for NeMo Relay."
readme = "README.md"

[lints]
workspace = true

[features]
default = []
schema = ["dep:schemars", "nemo-relay/schema"]

[dependencies]
nemo-relay.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
switchyard-libsy.workspace = true
switchyard-protocol.workspace = true
switchyard-translation.workspace = true
schemars = { version = "0.8", optional = true }
tokio = { version = "1", default-features = false, features = ["rt", "sync"] }
futures-util = "0.3"
http = "1"

[dev-dependencies]
tokio = { version = "1", features = ["net", "rt", "macros", "sync", "test-util", "rt-multi-thread", "time"] }
