[package]
name = "nemo-relay-node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Node.js native bindings for NeMo Relay built with napi-rs."
readme = "README.md"

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]
test = false

[features]
__skip-implicit-config = ["nemo-relay-plugin-host/__skip-implicit-config"]

[dependencies]
nemo-relay-builtins.workspace = true
# First-party crates.
nemo-relay-adaptive = { workspace = true }
nemo-relay-codecs.workspace = true
nemo-relay-diagnostics.workspace = true
nemo-relay-logging.workspace = true
nemo-relay-observability.workspace = true
nemo-relay-pii-redaction.workspace = true
nemo-relay-plugin-host.workspace = true
nemo-relay-runtime.workspace = true
nemo-relay-types.workspace = true

# Third-party dependencies.
chrono = { workspace = true, default-features = true }
log.workspace = true
napi = { workspace = true, features = ["napi8", "async", "serde-json"] }
napi-derive.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
stacker.workspace = true
tokio = { workspace = true, default-features = true, features = ["macros", "rt-multi-thread", "sync"] }
tokio-stream.workspace = true
uuid.workspace = true

[build-dependencies]
napi-build.workspace = true
