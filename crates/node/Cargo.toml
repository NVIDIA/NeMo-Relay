[package]
name = "nemo-relay-node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Node.js native bindings for NeMo Relay built with napi-rs."
readme = "README.md"

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]
test = false

[features]
__skip-implicit-config = ["nemo-relay/__skip-implicit-config"]

[dependencies]
nemo-relay-observability.workspace = true
# First-party crates.
nemo-relay = { workspace = true, features = ["atof-streaming", "object-store", "worker-grpc"] }
nemo-relay-adaptive = { workspace = true, features = ["redis-backend"] }
nemo-relay-pii-redaction.workspace = true

# Third-party dependencies.
chrono = { workspace = true, default-features = true }
log.workspace = true
napi = { workspace = true, features = ["napi6", "async", "serde-json", "tokio_rt"] }
napi-derive.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
stacker.workspace = true
tokio = { workspace = true, default-features = true, features = ["rt-multi-thread", "sync"] }
tokio-stream = { workspace = true, default-features = true, features = ["sync"] }
uuid = { workspace = true, features = ["v7"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[build-dependencies]
napi-build.workspace = true
