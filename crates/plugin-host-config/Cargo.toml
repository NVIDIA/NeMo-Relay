[package]
name = "nemo-relay-plugin-host-config"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared file-backed dynamic plugin host configuration for NeMo Relay."

[lints]
workspace = true

[dependencies]
nemo-relay = { workspace = true, features = ["worker-grpc"] }
base64 = "0.22"
dunce = "1"
fs2 = "0.4"
libc = "0.2"
log = "0.4"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["rt"] }
toml = "0.9"
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
