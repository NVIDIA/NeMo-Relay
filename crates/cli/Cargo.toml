[package]
name = "nemo-relay-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Coding-agent gateway CLI for NeMo Relay observability."

[[bin]]
name = "nemo-relay"
path = "src/main.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ version }/{ name }-{ target }-{ version }{ binary-ext }"
pkg-fmt = "bin"

[lints]
workspace = true

[features]
default = ["atof-streaming"]
atof-streaming = ["nemo-relay/atof-streaming"]
# Private test hooks; never enable for distributed CLI artifacts.
__test-cli-port-override = []
__skip-implicit-config = ["nemo-relay/__skip-implicit-config"]

[dependencies]
nemo-relay-runtime.workspace = true
nemo-relay-model-pricing.workspace = true
nemo-relay-resource-metrics.workspace = true
nemo-relay-observability.workspace = true
# First-party crates.
nemo-relay = { workspace = true, features = ["object-store", "worker-grpc", "__internal-gateway"] }
nemo-relay-adaptive = { workspace = true, features = ["redis-backend"] }
nemo-relay-pii-redaction.workspace = true
nemo-relay-types.workspace = true

# Third-party dependencies.
async-stream.workspace = true
axum = { workspace = true, features = ["ws"] }
base64.workspace = true
bytes.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
clap_complete.workspace = true
console.workspace = true
dialoguer = { workspace = true, features = ["password"] }
dotenvy.workspace = true
flate2.workspace = true
fs2.workspace = true
futures-util.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "server", "http1", "http2"] }
hyper-rustls = { workspace = true, features = ["http1", "http2", "native-tokio", "ring", "tls12"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "http2", "server-auto", "service", "tokio"] }
jsonschema.workspace = true
listeners.workspace = true
log = { workspace = true, features = ["kv"] }
percent-encoding.workspace = true
rcgen.workspace = true
regex.workspace = true
reqwest = { workspace = true, features = ["charset", "http2", "json", "rustls", "stream"] }
ring.workspace = true
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
semver.workspace = true
serde = { workspace = true, features = ["derive"] }
serde-saphyr.workspace = true
serde_json.workspace = true
sha2.workspace = true
strum = { workspace = true, features = ["derive"] }
subtle.workspace = true
tar.workspace = true
thiserror.workspace = true
tokio = { workspace = true, default-features = true, features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }
tokio-tungstenite = { workspace = true, features = ["connect", "rustls-tls-native-roots"] }
toml.workspace = true
toml_edit.workspace = true
tower-service.workspace = true
uuid = { workspace = true, features = ["serde", "v7"] }
zip = { workspace = true, features = ["deflate"] }
zstd.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(any(unix, windows))'.dependencies]
sysinfo = { workspace = true, features = ["system"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[dev-dependencies]
# First-party crates.
nemo-relay = { workspace = true, features = ["__test-plugin-host"] }

# Third-party dependencies.
opentelemetry = { workspace = true, features = ["trace"] }
opentelemetry_sdk = { workspace = true, features = ["trace", "testing"] }
shell-words.workspace = true
syn = { workspace = true, features = ["full", "visit"] }
tempfile.workspace = true
tokio = { workspace = true, default-features = true, features = ["test-util"] }
tower = { workspace = true, features = ["util"] }
