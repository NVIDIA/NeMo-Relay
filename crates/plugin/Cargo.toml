[package]
name = "nemo-relay-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust plugin authoring SDK and stable native plugin ABI for NeMo Relay."

[lints]
workspace = true

[dependencies]
# First-party crates.
nemo-relay-types.workspace = true

# Third-party dependencies.
futures.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
schemars = { workspace = true }
tokio = { workspace = true, default-features = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
