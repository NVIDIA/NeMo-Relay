[package]
name = "nemo-relay-observability"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Built-in observability exporters and projections for NeMo Relay."

[lints]
workspace = true

[features]
default = []
__test-support = []
object-store = ["dep:object_store", "tokio/net", "tokio/time"]
schema = ["dep:schemars", "nemo-relay-types/schema", "nemo-relay-plugin/schema", "nemo-relay-model-pricing/schema"]
atof-streaming = ["dep:tokio-tungstenite", "tokio/io-util", "tokio/net", "tokio/rt-multi-thread", "tokio/time"]

[dependencies]
nemo-relay-plugin.workspace = true
object_store = { workspace = true, features = ["aws"], optional = true }
# First-party crates.
nemo-relay-model-pricing.workspace = true
nemo-relay-types.workspace = true

# Third-party dependencies.
async-trait.workspace = true
base64.workspace = true
chrono = { workspace = true, default-features = true, features = ["serde"] }
futures-util.workspace = true
http.workspace = true
log = { workspace = true, features = ["kv", "kv_serde"] }
opentelemetry = { workspace = true, features = ["trace", "logs", "metrics"] }
opentelemetry-http.workspace = true
opentelemetry-otlp = { workspace = true, features = ["trace", "logs", "metrics", "http-proto", "http-json", "reqwest-client", "reqwest-rustls", "grpc-tonic", "gzip-http", "gzip-tonic", "zstd-http", "zstd-tonic", "tls-ring", "tls-roots"] }
opentelemetry-proto = { workspace = true, features = ["gen-tonic-messages", "trace", "with-serde"] }
opentelemetry-semantic-conventions = { workspace = true, features = ["semconv_experimental"] }
opentelemetry_sdk = { workspace = true, features = ["trace", "logs", "metrics", "internal-logs", "rt-tokio", "experimental_trace_batch_span_processor_with_async_runtime", "experimental_logs_batch_log_processor_with_async_runtime", "experimental_metrics_periodicreader_with_async_runtime"] }
prost.workspace = true
reqwest = { workspace = true, features = ["charset", "http2", "rustls", "stream"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
schemars = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { workspace = true, features = ["connect", "rustls-tls-native-roots"], optional = true }
tonic.workspace = true
unicode-general-category.workspace = true
uuid = { workspace = true, features = ["v7", "serde"] }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "param"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[dev-dependencies]
rcgen.workspace = true
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }
nemo-relay-model-pricing = { workspace = true, features = ["__test-support"] }
spdlog-rs = { workspace = true, features = ["log", "multi-thread"] }
futures.workspace = true
tokio-stream = { workspace = true, features = ["net"] }
tonic = { workspace = true, features = ["server", "transport", "router"] }

toml.workspace = true
tempfile.workspace = true

opentelemetry_sdk = { workspace = true, features = ["trace", "logs", "metrics", "testing"] }
opentelemetry-proto = { workspace = true, features = ["gen-tonic", "logs", "metrics"] }
