manifest_version = 1

[plugin]
id = "nemo_relay.pii_rampart"
kind = "worker"

[compat]
relay = ">=0.7,<1.0"
worker_protocol = "grpc-v1"

[defaults]
enabled = false

[capabilities]
items = ["plugin_worker", "config_schema"]

[config_schema]
path = "config.schema.json"

[source]
manifest_root = "."
artifact = "nemo_relay_pii_rampart/worker.py"

[integrity]
sha256 = "sha256:96a3dcf534061db2b5f3146702f433fdb2a10d980230dff13f740cc74897cd2c"

[load]
runtime = "python"
entrypoint = "nemo_relay_pii_rampart.worker:main"
