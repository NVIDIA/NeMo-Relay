manifest_version = 1

[plugin]
id = "nemo_relay.pii_rampart"
kind = "worker"

[compat]
relay = ">=0.7,<1.0"
worker_protocol = "grpc-v1"

[defaults]
enabled = false

[capabilities]
items = ["plugin_worker", "config_schema"]

[config_schema]
path = "config.schema.json"

[source]
manifest_root = "."
artifact = "nemo_relay_pii_rampart/worker.py"

[integrity]
sha256 = "sha256:e0ab2677112b8687d0bee32b257373a4057878f437ec8b66a233cb7b02533338"

[load]
runtime = "python"
entrypoint = "nemo_relay_pii_rampart.worker:main"
