[package]
name = "nemo-relay-pii-redaction"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "First-party deterministic and model-backed PII redaction plugin surfaces for NeMo Relay."
readme = "README.md"

[lints]
workspace = true

[dependencies]
# First-party crates.
nemo-relay-codecs.workspace = true
nemo-relay-diagnostics.workspace = true
nemo-relay-observability.workspace = true
nemo-relay-plugin-host.workspace = true
nemo-relay-runtime.workspace = true
nemo-relay-types.workspace = true

# Third-party dependencies.
log = { workspace = true, features = ["kv"] }
regex.workspace = true
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
# First-party crates.
nemo-relay-logging.workspace = true

# Third-party dependencies.
futures.workspace = true
opentelemetry = { workspace = true, features = ["trace"] }
opentelemetry-proto = { workspace = true, features = ["gen-tonic", "metrics"] }
opentelemetry_sdk = { workspace = true, features = ["trace", "testing"] }
prost.workspace = true
tempfile.workspace = true
tokio = { workspace = true, default-features = true, features = ["rt", "macros", "sync", "test-util", "rt-multi-thread", "time"] }
