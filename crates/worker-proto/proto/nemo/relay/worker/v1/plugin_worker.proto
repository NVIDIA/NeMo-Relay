syntax = "proto3";

package nemo.relay.worker.v1;

service PluginWorker {
  rpc Handshake(HandshakeRequest) returns (HandshakeResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Validate(ValidateRequest) returns (ValidateResponse);
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Invoke(InvokeRequest) returns (InvokeResponse);
  rpc InvokeStream(InvokeRequest) returns (stream StreamChunk);
  rpc CancelInvocation(CancelInvocationRequest) returns (WorkerAck);
  rpc Shutdown(ShutdownRequest) returns (WorkerAck);
}

service RelayHostRuntime {
  rpc Log(LogRequest) returns (HostAck);
  rpc EmitMark(EmitMarkRequest) returns (HostAck);
  rpc GetCurrentScopeStackSnapshot(GetCurrentScopeStackSnapshotRequest) returns (GetCurrentScopeStackSnapshotResponse);
  rpc GetRuntimeDiagnostics(GetRuntimeDiagnosticsRequest) returns (GetRuntimeDiagnosticsResponse);
  rpc PushScope(PushScopeRequest) returns (PushScopeResponse);
  rpc PopScope(PopScopeRequest) returns (HostAck);
  rpc CreateScopeStack(CreateScopeStackRequest) returns (CreateScopeStackResponse);
  rpc DropScopeStack(DropScopeStackRequest) returns (HostAck);
  rpc ToolNext(ToolNextRequest) returns (ToolExecutionResultResponse);
  rpc LlmNext(LlmNextRequest) returns (JsonResult);
  rpc LlmStreamNext(LlmStreamNextRequest) returns (stream StreamChunk);
  rpc DecodeLlmCodecRequest(LlmCodecDecodeRequest) returns (JsonResult);
  rpc EncodeLlmCodecRequest(LlmCodecEncodeRequest) returns (JsonResult);
  rpc DecodeLlmCodecResponse(LlmCodecDecodeResponse) returns (JsonResult);
  rpc ListRuntimeRegistrations(ListRuntimeRegistrationsRequest)
      returns (ListRuntimeRegistrationsResponse);
  rpc RegisterConditionalMiddlewareGuardrail(RegisterConditionalMiddlewareGuardrailRequest)
      returns (RegisterConditionalMiddlewareGuardrailResponse);
  rpc DeregisterConditionalMiddlewareGuardrail(DeregisterConditionalMiddlewareGuardrailRequest)
      returns (DeregisterConditionalMiddlewareGuardrailResponse);
}

// Independently bounded, additive diagnostics service. Execution and legacy
// RelayHostRuntime limits and semantics are unchanged. Older hosts return
// UNIMPLEMENTED. Read permission is separate from submission permission.
service RelayDiagnostics {
  rpc GetDiagnosticCapabilities(DiagnosticCredentials) returns (DiagnosticCapabilities);
  rpc OpenDiagnosticSession(DiagnosticOpenRequest) returns (DiagnosticSession);
  rpc SubmitDiagnostic(DiagnosticSubmission) returns (DiagnosticReceipt);
  rpc ReadDiagnosticPage(DiagnosticReadRequest) returns (DiagnosticReadResponse);
}

message DiagnosticCredentials {
  string activation_id = 1;
  string auth_token = 2;
}

message DiagnosticCapabilities {
  uint32 protocol_version = 1;
  uint32 snapshot_version = 2;
  uint32 catalogue_version = 3;
  bool enabled = 4;
  bool can_read_context = 5;
  uint32 max_components = 6;
  uint32 max_extensions = 7;
  uint32 max_metadata_bytes = 8;
  // Maximum encoded DiagnosticSubmission size, including credentials/session/sequence fields.
  uint32 max_request_bytes = 9;
  uint32 max_detail_bytes = 10;
  uint32 max_correlation_bytes = 11;
  // Maximum encoded diagnostic response size for this session.
  uint32 max_response_bytes = 12;
  // SDK queue slots; the single in-flight request and host session capacity are separate.
  uint32 max_pending_submissions = 13;
  // Maximum SubmitDiagnostic attempts, including the initial attempt.
  uint32 retry_attempts = 14;
  // Per-attempt SubmitDiagnostic deadline; bootstrap and lifecycle drain use local bounds.
  uint32 retry_timeout_millis = 15;
  // Version 1 retains authenticated remote provenance in canonical event pages.
  uint32 provenance_version = 16;
}

message DiagnosticOpenRequest {
  DiagnosticCredentials credentials = 1;
  uint32 protocol_version = 2;
  uint32 snapshot_version = 3;
  uint32 provenance_version = 4;
}

message DiagnosticSession {
  // Host-issued UUID; also the producer source incarnation.
  bytes session_id = 1;
  DiagnosticCapabilities capabilities = 2;
}

enum DiagnosticObservationOutcome {
  DIAGNOSTIC_OBSERVATION_OUTCOME_UNKNOWN = 0;
  DIAGNOSTIC_OBSERVATION_OUTCOME_SUCCESS = 1;
  DIAGNOSTIC_OBSERVATION_OUTCOME_FAILURE = 2;
}

enum DiagnosticObservationSeverity {
  DIAGNOSTIC_OBSERVATION_SEVERITY_UNSPECIFIED = 0;
  DIAGNOSTIC_OBSERVATION_SEVERITY_TRACE = 1;
  DIAGNOSTIC_OBSERVATION_SEVERITY_DEBUG = 2;
  DIAGNOSTIC_OBSERVATION_SEVERITY_INFO = 3;
  DIAGNOSTIC_OBSERVATION_SEVERITY_WARNING = 4;
  DIAGNOSTIC_OBSERVATION_SEVERITY_ERROR = 5;
}

message DiagnosticExtensionDefinition {
  string name = 1;
  string description = 2;
  DiagnosticObservationOutcome outcome = 3;
  repeated string allowed_failure_classes = 4;
}

message DiagnosticCodeDefinition {
  oneof definition {
    string builtin_name = 1;
    DiagnosticExtensionDefinition extension = 2;
  }
}

message DiagnosticComponentRegistration {
  string local_name = 1;
  repeated DiagnosticCodeDefinition codes = 2;
}

message DiagnosticObservation {
  uint32 component = 1;
  uint32 code = 2;
  optional string failure_class = 3;
  DiagnosticObservationOutcome outcome = 4;
  DiagnosticObservationSeverity severity = 5;
  uint64 count = 6;
  optional int64 observed_unix_micros = 7;
  optional string detail = 8;
  optional string session_id = 9;
  optional string request_id = 10;
}

message DiagnosticComponentClose { uint32 component = 1; }
message DiagnosticSessionClose {}

// A single ordered stream serializes registration, recording, and closure.
// Identical retries reuse sequence and payload. No execution error is retried.
message DiagnosticSubmission {
  DiagnosticCredentials credentials = 1;
  bytes session_id = 2;
  uint64 sequence = 3;
  oneof operation {
    DiagnosticComponentRegistration register_component = 4;
    DiagnosticObservation record = 5;
    DiagnosticComponentClose close_component = 6;
    DiagnosticSessionClose close_session = 7;
  }
}

enum DiagnosticReceiptStatus {
  DIAGNOSTIC_RECEIPT_STATUS_UNSPECIFIED = 0;
  DIAGNOSTIC_RECEIPT_STATUS_RECORDED = 1;
  DIAGNOSTIC_RECEIPT_STATUS_DISABLED = 2;
  DIAGNOSTIC_RECEIPT_STATUS_REJECTED = 3;
  DIAGNOSTIC_RECEIPT_STATUS_REGISTERED = 4;
  DIAGNOSTIC_RECEIPT_STATUS_CLOSED = 5;
}

enum DiagnosticEvidenceRetention {
  DIAGNOSTIC_EVIDENCE_RETENTION_UNSPECIFIED = 0;
  DIAGNOSTIC_EVIDENCE_RETENTION_RETAINED = 1;
  DIAGNOSTIC_EVIDENCE_RETENTION_TRUNCATED = 2;
  DIAGNOSTIC_EVIDENCE_RETENTION_DROPPED = 3;
}

message DiagnosticReceipt {
  uint64 submission_sequence = 1;
  DiagnosticReceiptStatus status = 2;
  uint64 host_sequence = 3;
  DiagnosticEvidenceRetention evidence = 4;
  uint32 component = 5;
  // Code handles are one-based positions in the admitted registration.
  uint32 code_count = 6;
  // Fixed safe reason, never source error text or request payload.
  string reason = 7;
}

message DiagnosticReadRequest {
  DiagnosticCredentials credentials = 1;
  bytes session_id = 2;
  // Canonical query is a closed transport structure; cursor is host-bound.
  optional string component = 3;
  optional string code = 4;
  optional uint64 after_sequence = 5;
  uint32 max_components = 6;
  uint32 max_events = 7;
  bytes continuation = 8;
}

message DiagnosticReadResponse {
  // One bounded canonical snapshot page, with lossless decimal JSON counters.
  bytes snapshot_json = 1;
  // Session-bound transport continuation; not an authority grant.
  bytes continuation = 2;
}

// Process-log levels accepted from an authenticated plugin. The host owns the
// final sink configuration and filters records with its configured threshold.
enum LogLevel {
  LOG_LEVEL_UNSPECIFIED = 0;
  LOG_LEVEL_ERROR = 1;
  LOG_LEVEL_WARN = 2;
  LOG_LEVEL_INFO = 3;
  LOG_LEVEL_DEBUG = 4;
  LOG_LEVEL_TRACE = 5;
}

message LogRequest {
  string activation_id = 1;
  string auth_token = 2;
  LogLevel level = 3;
  string target = 4;
  string message = 5;
  // Optional open plugin attributes. The JSON value must be an object.
  JsonValue fields = 6;
}

message JsonEnvelope {
  string schema = 1;
  bytes json = 2;
}

// A lossless JSON value. The bytes MUST contain exactly one JSON value.
message JsonValue {
  bytes json = 1;
}

enum RegistrationSurface {
  REGISTRATION_SURFACE_UNSPECIFIED = 0;
  SUBSCRIBER = 1;
  EVENT_METADATA_INJECTOR = 2;
  TOOL_SANITIZE_REQUEST_GUARDRAIL = 10;
  TOOL_SANITIZE_RESPONSE_GUARDRAIL = 11;
  TOOL_CONDITIONAL_EXECUTION_GUARDRAIL = 12;
  TOOL_REQUEST_INTERCEPT = 13;
  TOOL_EXECUTION_INTERCEPT = 14;
  LLM_SANITIZE_REQUEST_GUARDRAIL = 20;
  LLM_SANITIZE_RESPONSE_GUARDRAIL = 21;
  LLM_CONDITIONAL_EXECUTION_GUARDRAIL = 22;
  LLM_REQUEST_INTERCEPT = 23;
  LLM_EXECUTION_INTERCEPT = 24;
  LLM_STREAM_EXECUTION_INTERCEPT = 25;
  MARK_SANITIZE_GUARDRAIL = 30;
  SCOPE_SANITIZE_START_GUARDRAIL = 31;
  SCOPE_SANITIZE_END_GUARDRAIL = 32;
  CONDITIONAL_MIDDLEWARE_GUARDRAIL = 40;
}

enum RuntimeRegistrationOwnerKind {
  RUNTIME_REGISTRATION_OWNER_KIND_UNSPECIFIED = 0;
  RUNTIME_REGISTRATION_OWNER_KIND_CORE = 1;
  RUNTIME_REGISTRATION_OWNER_KIND_GLOBAL_API = 2;
  RUNTIME_REGISTRATION_OWNER_KIND_PLUGIN = 3;
}

message RuntimeRegistrationOwner {
  RuntimeRegistrationOwnerKind kind = 1;
  optional string plugin_kind = 2;
  optional uint32 component_ordinal = 3;
}

message RuntimeRegistrationIdentity {
  RegistrationSurface kind = 1;
  string local_name = 2;
  string effective_name = 3;
  RuntimeRegistrationOwner owner = 4;
}

message ListRuntimeRegistrationsRequest {
  string activation_id = 1;
  string auth_token = 2;
  repeated RegistrationSurface kinds = 3;
}

message ListRuntimeRegistrationsResponse {
  repeated RuntimeRegistrationIdentity registrations = 1;
  WorkerError error = 2;
}

message RegisterConditionalMiddlewareGuardrailRequest {
  string activation_id = 1;
  string auth_token = 2;
  string name = 3;
  repeated RegistrationSurface kinds = 4;
  string registration_name = 5;
  string reason = 6;
  bool callback = 7;
}

message RegisterConditionalMiddlewareGuardrailResponse {
  string handle = 1;
  WorkerError error = 2;
}

message DeregisterConditionalMiddlewareGuardrailRequest {
  string activation_id = 1;
  string auth_token = 2;
  string handle = 3;
}

message DeregisterConditionalMiddlewareGuardrailResponse {
  bool removed = 1;
  WorkerError error = 2;
}

enum LlmCodecKind {
  LLM_CODEC_KIND_UNSPECIFIED = 0;
  LLM_CODEC_KIND_BUILTIN = 1;
  LLM_CODEC_KIND_RUNTIME = 2;
  LLM_CODEC_KIND_OPAQUE = 3;
}

enum ScopeType {
  SCOPE_TYPE_UNSPECIFIED = 0;
  AGENT = 1;
  FUNCTION = 2;
  TOOL = 3;
  LLM = 4;
  RETRIEVER = 5;
  EMBEDDER = 6;
  RERANKER = 7;
  GUARDRAIL = 8;
  EVALUATOR = 9;
  CUSTOM = 10;
  UNKNOWN = 11;
}

message HandshakeRequest {
  string activation_id = 1;
  string plugin_id = 2;
  string relay_version = 3;
  string worker_protocol = 4;
  string auth_token = 5;
  string host_endpoint = 6;
}

message HandshakeResponse {
  string plugin_id = 1;
  string plugin_kind = 2;
  bool allows_multiple_components = 3;
  string worker_protocol = 4;
  string sdk_name = 5;
  string sdk_version = 6;
  string runtime_name = 7;
  string runtime_version = 8;
  repeated RegistrationSurface supported_surfaces = 9;
}

message HealthRequest {
  string activation_id = 1;
  string auth_token = 2;
}

message HealthResponse {
  bool ok = 1;
  string message = 2;
  string plugin_id = 3;
  string worker_protocol = 4;
  string sdk_name = 5;
  string sdk_version = 6;
  string runtime_name = 7;
  string runtime_version = 8;
}

message ValidateRequest {
  string activation_id = 1;
  string plugin_id = 2;
  string auth_token = 3;
  JsonEnvelope config = 4;
}

message ValidateResponse {
  JsonEnvelope diagnostics = 1;
  WorkerError error = 2;
}

message RegisterRequest {
  string activation_id = 1;
  string plugin_id = 2;
  string auth_token = 3;
  JsonEnvelope config = 4;
}

message RegisterResponse {
  repeated Registration registrations = 1;
  WorkerError error = 2;
  repeated ConditionalMiddlewareGuardrailRegistration conditional_middleware_guardrails = 3;
}

message ConditionalMiddlewareGuardrailRegistration {
  string name = 1;
  repeated RegistrationSurface kinds = 2;
  string registration_name = 3;
  string reason = 4;
  bool callback = 5;
}

message Registration {
  string local_name = 1;
  RegistrationSurface surface = 2;
  int32 priority = 3;
  bool break_chain = 4;
  reserved 5;
}

message InvokeRequest {
  string activation_id = 1;
  string invocation_id = 2;
  string registration_name = 3;
  RegistrationSurface surface = 4;
  string continuation_id = 5;
  ScopeContext scope = 6;
  string auth_token = 7;

  oneof payload {
    JsonEnvelope event = 10;
    ToolInvocation tool = 11;
    LlmInvocation llm = 12;
    ConditionalMiddlewareInvocation conditional_middleware = 13;
  }
}

message ConditionalMiddlewareInvocation {
  repeated RegistrationSurface kinds = 1;
  string registration_name = 2;
}

message ToolInvocation {
  string tool_name = 1;
  JsonEnvelope value = 2;
  // Provider-issued tool-call correlation identifier recorded on the managed
  // tool call. Unset when the call did not record one, and unset for
  // invocations that are not tool execution intercepts.
  optional string tool_call_id = 3;
}

message LlmInvocation {
  string model_name = 1;
  JsonEnvelope request = 2;
  JsonEnvelope annotated_request = 3;
  JsonEnvelope response = 4;
  reserved 5, 6, 7, 8;
  oneof sanitize_context {
    LlmSanitizeRequestContext request_sanitize_context = 9;
    LlmSanitizeResponseContext response_sanitize_context = 10;
  }
  // Present for LLM execution interceptors. Older workers ignore this
  // additive field at the wire boundary, but worker SDK callback signatures
  // are release-versioned and must match the Relay release they target.
  LlmExecutionCodecContext execution_codec_context = 11;
}

message LlmExecutionCodecContext {
  LlmSanitizeRequestContext request = 1;
  LlmSanitizeResponseContext response = 2;
}

message LlmCodecIdentity {
  LlmCodecKind kind = 1;
  optional string id = 2;
}

message LlmSanitizeRequestContext {
  LlmCodecIdentity codec = 1;
  // Opaque, invocation-scoped host capability. SDKs must not expose this value.
  optional string codec_capability_id = 2;
}

message LlmSanitizeResponseContext {
  LlmCodecIdentity codec = 1;
  // Opaque, invocation-scoped host capability. SDKs must not expose this value.
  optional string codec_capability_id = 2;
}

message InvokeResponse {
  oneof result {
    EmptyResult empty = 1;
    JsonResult json = 2;
    GuardrailResult guardrail = 3;
    LlmRequestInterceptResult llm_request = 4;
    WorkerError error = 5;
    ToolExecutionInterceptResult tool_execution = 6;
  }
}

message EmptyResult {}

message JsonResult {
  JsonEnvelope value = 1;
  WorkerError error = 2;
}

message ToolExecutionResultResponse {
  ToolExecutionResult value = 1;
  WorkerError error = 2;
}

message ToolExecutionResult {
  // Required. Application-owned tool result.
  JsonValue result = 1;
  // Optional opaque metadata. JSON null MUST be treated as absent.
  JsonValue annotation = 2;
}

message ToolExecutionInterceptOutcome {
  // Required. Application-owned tool result.
  JsonValue result = 1;
  // Optional opaque metadata. JSON null MUST be treated as absent.
  JsonValue annotation = 2;
  // Optional Relay-owned pending-mark array. An absent value means no marks.
  JsonValue pending_marks = 3;
}

message GuardrailResult {
  string block_reason = 1;
}

message LlmRequestInterceptResult {
  JsonEnvelope outcome = 1;
}

message ToolExecutionInterceptResult {
  // Required.
  ToolExecutionInterceptOutcome outcome = 1;
}

message StreamChunk {
  oneof item {
    JsonEnvelope value = 1;
    WorkerError error = 2;
  }
}

message CancelInvocationRequest {
  string activation_id = 1;
  string invocation_id = 2;
  string auth_token = 3;
  string reason = 4;
}

message ShutdownRequest {
  string activation_id = 1;
  string auth_token = 2;
  string reason = 3;
}

message WorkerAck {
  bool accepted = 1;
  string message = 2;
}

message HostAck {
  bool ok = 1;
  WorkerError error = 2;
}

message GetRuntimeDiagnosticsRequest {
  string activation_id = 1;
  string auth_token = 2;
}

message RuntimeDiagnostic {
  string code = 1;
  string message = 2;
  uint64 count = 3;
}

message GetRuntimeDiagnosticsResponse {
  repeated RuntimeDiagnostic entries = 1;
}

message WorkerError {
  string code = 1;
  string message = 2;
  bool retryable = 3;
}

// Owned root-to-top identities; never opaque binding or invocation IDs.
message ScopeStackEntry {
  string scope_id = 1;
  ScopeType scope_type = 2;
}
message ScopeStackSnapshot {
  repeated ScopeStackEntry scopes = 1;
}
message GetCurrentScopeStackSnapshotRequest {
  string activation_id = 1;
  string auth_token = 2;
  ScopeContext scope = 3;
}
message GetCurrentScopeStackSnapshotResponse {
  // Absence means no bound context, not an empty/root-only stack.
  ScopeStackSnapshot snapshot = 1;
  WorkerError error = 2;
}

message ScopeContext {
  string scope_stack_id = 1;
  string parent_scope_id = 2;
}

message EmitMarkRequest {
  string activation_id = 1;
  string auth_token = 2;
  ScopeContext scope = 3;
  string name = 4;
  JsonEnvelope data = 5;
  JsonEnvelope metadata = 6;
  JsonEnvelope data_schema = 7;
  string severity = 8;
  string category = 9;
}

message PushScopeRequest {
  string activation_id = 1;
  string auth_token = 2;
  ScopeContext scope = 3;
  string name = 4;
  ScopeType scope_type = 5;
  JsonEnvelope data = 6;
  JsonEnvelope metadata = 7;
  JsonEnvelope input = 8;
  optional int64 timestamp_unix_micros = 9;
}

message PushScopeResponse {
  string scope_handle_id = 1;
  WorkerError error = 2;
}

message PopScopeRequest {
  string activation_id = 1;
  string auth_token = 2;
  string scope_handle_id = 3;
  JsonEnvelope output = 4;
  JsonEnvelope metadata = 5;
  optional int64 timestamp_unix_micros = 6;
}

message CreateScopeStackRequest {
  string activation_id = 1;
  string auth_token = 2;
}

message CreateScopeStackResponse {
  string scope_stack_id = 1;
  WorkerError error = 2;
}

message DropScopeStackRequest {
  string activation_id = 1;
  string auth_token = 2;
  string scope_stack_id = 3;
}

message ToolNextRequest {
  string activation_id = 1;
  string auth_token = 2;
  string continuation_id = 3;
  JsonEnvelope value = 4;
  ScopeContext scope = 5;
}

message LlmNextRequest {
  string activation_id = 1;
  string auth_token = 2;
  string continuation_id = 3;
  JsonEnvelope request = 4;
  ScopeContext scope = 5;
}

message LlmStreamNextRequest {
  string activation_id = 1;
  string auth_token = 2;
  string continuation_id = 3;
  JsonEnvelope request = 4;
  ScopeContext scope = 5;
}

message LlmCodecDecodeRequest {
  string activation_id = 1;
  string auth_token = 2;
  string codec_capability_id = 3;
  JsonEnvelope request = 4;
  string invocation_id = 5;
}

message LlmCodecEncodeRequest {
  string activation_id = 1;
  string auth_token = 2;
  string codec_capability_id = 3;
  JsonEnvelope annotated_request = 4;
  JsonEnvelope original_request = 5;
  string invocation_id = 6;
}

message LlmCodecDecodeResponse {
  string activation_id = 1;
  string auth_token = 2;
  string codec_capability_id = 3;
  JsonEnvelope response = 4;
  string invocation_id = 5;
}
