[package]
name = "nemo-relay-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust SDK for NeMo Relay out-of-process gRPC worker plugins."

[lints]
workspace = true

[dependencies]
# First-party crates.
nemo-relay-types.workspace = true
nemo-relay-worker-proto.workspace = true

# Third-party dependencies.
futures-util.workspace = true
hyper-util = { workspace = true, features = ["tokio"] }
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, default-features = true, features = ["macros", "net", "rt-multi-thread", "sync"] }
tokio-stream = { workspace = true, default-features = true, features = ["net", "sync"] }
tonic = { workspace = true, features = ["codegen", "router", "transport"] }
tower = { workspace = true, features = ["util"] }
