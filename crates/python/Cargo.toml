[package]
name = "nemo-relay-python"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Python native extension bindings for NeMo Relay built with PyO3."
readme = "README.md"

[lints]
workspace = true

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
__skip-implicit-config = ["nemo-relay/__skip-implicit-config"]

[dependencies]
# First-party crates.
nemo-relay = { workspace = true, features = ["atof-streaming", "object-store", "worker-grpc"] }
nemo-relay-adaptive = { workspace = true, features = ["redis-backend"] }
nemo-relay-pii-redaction.workspace = true

# Third-party dependencies.
chrono = { workspace = true, default-features = true }
pyo3 = { workspace = true, features = ["abi3", "abi3-py311", "experimental-inspect", "macros"] }
pyo3-async-runtimes = { workspace = true, features = ["tokio-runtime"] }
pythonize.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, default-features = true, features = ["full"] }
tokio-stream = { workspace = true, default-features = true }
uuid = { workspace = true, features = ["v7"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
# First-party crates.
nemo-relay = { workspace = true, features = ["__test-plugin-host"] }

# Third-party dependencies.
tempfile.workspace = true
