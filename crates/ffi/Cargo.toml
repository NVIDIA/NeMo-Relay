[package]
name = "nemo-relay-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "C-compatible FFI bindings for integrating NeMo Relay into native applications."
readme = "README.md"

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
__skip-implicit-config = ["nemo-relay/__skip-implicit-config"]

[dependencies]
nemo-relay-logging.workspace = true
nemo-relay-diagnostics.workspace = true
nemo-relay-codecs.workspace = true
nemo-relay-types.workspace = true
nemo-relay-runtime.workspace = true
nemo-relay-observability.workspace = true
# First-party crates.
nemo-relay = { workspace = true }
nemo-relay-adaptive = { workspace = true }
nemo-relay-pii-redaction.workspace = true

# Third-party dependencies.
chrono = { workspace = true, default-features = true }
libc.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, default-features = true, features = ["rt-multi-thread"] }
tokio-stream = { workspace = true, default-features = true }
uuid = { workspace = true, features = ["v7"] }

[build-dependencies]
cbindgen.workspace = true

[dev-dependencies]
sha2.workspace = true
tempfile.workspace = true
