[package]
name = "nemo-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core Rust SDK for NeMo Relay observability, scope management, and runtime instrumentation."
readme = "README.md"

[lints]
workspace = true

[features]
default = [
    "object-store",
]
atof-streaming = [
    "dep:tokio-tungstenite",
    "tokio/io-util",
    "tokio/net",
    "tokio/rt-multi-thread",
    "tokio/time",
]
schema = ["dep:schemars", "nemo-relay-types/schema"]
# Internal CLI gateway support; no compatibility guarantee.
__internal-gateway = []
# Private test hook for suppressing implicit user/system plugin discovery.
__skip-implicit-config = []
# Private compatibility-free test harness for migrating legacy lifecycle tests.
__test-plugin-host = []
object-store = [
    "dep:object_store",
    "tokio/net",
    "tokio/time",
]
worker-grpc = [
    "dep:nemo-relay-worker-proto",
    "dep:hyper-util",
    "dep:tower",
    "tokio-stream/net",
    "tonic/codegen",
    "tonic/router",
    "tonic/transport",
    "tokio/io-util",
    "tokio/net",
    "tokio/process",
    "tokio/rt-multi-thread",
]

[dependencies]
# First-party crates.
nemo-relay-plugin.workspace = true
nemo-relay-types.workspace = true
nemo-relay-worker-proto = { workspace = true, optional = true }

# Third-party dependencies.
arrayvec.workspace = true
async-trait.workspace = true
base64.workspace = true
bitflags = { workspace = true, features = ["serde"] }
chrono = { workspace = true, default-features = true, features = ["serde"] }
circular-buffer.workspace = true
enumset.workspace = true
futures-util.workspace = true
http.workspace = true
http-body.workspace = true
hyper-util = { workspace = true, features = ["tokio"], optional = true }
jsonschema.workspace = true
libloading.workspace = true
log = { workspace = true, features = ["kv", "kv_serde"] }
object_store = { workspace = true, features = ["aws"], optional = true }
opentelemetry = { workspace = true, features = ["trace", "logs", "metrics"] }
opentelemetry-http.workspace = true
opentelemetry-otlp = { workspace = true, features = ["trace", "logs", "metrics", "http-proto", "http-json", "reqwest-client", "reqwest-rustls", "grpc-tonic", "gzip-http", "gzip-tonic", "zstd-http", "zstd-tonic", "tls-ring", "tls-roots"] }
opentelemetry-proto = { workspace = true, features = ["gen-tonic-messages", "trace", "with-serde"] }
opentelemetry-semantic-conventions = { workspace = true, features = ["semconv_experimental"] }
opentelemetry_sdk = { workspace = true, features = ["trace", "logs", "metrics", "internal-logs", "rt-tokio", "experimental_trace_batch_span_processor_with_async_runtime", "experimental_logs_batch_log_processor_with_async_runtime", "experimental_metrics_periodicreader_with_async_runtime"] }
percent-encoding.workspace = true
prost.workspace = true
reqwest = { workspace = true, features = ["charset", "http2", "rustls", "stream"] }
ring.workspace = true
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
schemars = { workspace = true, optional = true }
semver.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
sha2.workspace = true
shell-words.workspace = true
spdlog-rs = { workspace = true, features = ["log", "multi-thread"] }
strum = { workspace = true, features = ["derive"] }
sysinfo = { workspace = true, features = ["system", "network"] }
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
tokio-stream = { workspace = true, features = ["sync"] }
tokio-tungstenite = { workspace = true, features = ["connect", "rustls-tls-native-roots"], optional = true }
toml.workspace = true
tonic.workspace = true
tower = { workspace = true, features = ["util"], optional = true }
tracing = { workspace = true, features = ["std", "log"] }
typed-builder.workspace = true
unicode-general-category.workspace = true
uuid = { workspace = true, features = ["v7", "serde"] }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "param"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[dev-dependencies]
futures.workspace = true
object_store = { workspace = true, features = ["aws"] }
opentelemetry-proto = { workspace = true, features = ["gen-tonic", "logs", "metrics"] }
opentelemetry_sdk = { workspace = true, features = ["trace", "logs", "metrics", "testing"] }
rcgen.workspace = true
serde_json.workspace = true
tokio = { workspace = true, default-features = true, features = ["rt", "macros", "sync", "test-util", "rt-multi-thread", "time"] }
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }
tokio-stream = { workspace = true, default-features = true, features = ["net"] }
tonic = { workspace = true, default-features = true, features = ["transport"] }

[[test]]
name = "codec_integration"
path = "tests/integration/codec_tests.rs"

[[test]]
name = "context_isolation_integration"
path = "tests/integration/context_isolation_tests.rs"

[[test]]
name = "native_plugin_integration"
path = "tests/integration/native_plugin_tests.rs"

[[test]]
name = "plugin_host_builtin_ownership"
path = "tests/integration/plugin_host_builtin_ownership_tests.rs"

[[test]]
name = "worker_plugin_integration"
path = "tests/integration/worker_plugin_tests.rs"
required-features = ["worker-grpc"]

[[test]]
name = "middleware_integration"
path = "tests/integration/middleware_tests.rs"

[[test]]
name = "pipeline_integration"
path = "tests/integration/pipeline_tests.rs"

[[test]]
name = "scope_local_integration"
path = "tests/integration/scope_local_tests.rs"

[[test]]
name = "stream_integration"
path = "tests/integration/stream_tests.rs"

[[test]]
name = "subscriber_dispatcher_integration"
path = "tests/integration/subscriber_dispatcher_tests.rs"

[[test]]
name = "api_surface_integration"
path = "tests/integration/api_surface_tests.rs"

[[test]]
name = "atif_storage_integration"
path = "tests/integration/atif_storage_tests.rs"
required-features = ["object-store"]

[[test]]
name = "embedded_diagnostics_startup"
path = "tests/embedded_diagnostics_startup.rs"
