[package]
name = "nemo-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Public Rust SDK composition and lifecycle APIs for NeMo Relay."
readme = "README.md"

[lints]
workspace = true

[features]
__skip-implicit-config = ["nemo-relay-plugin-host/__skip-implicit-config"]
[dependencies]
# First-party crates.
nemo-relay-codecs.workspace = true
nemo-relay-diagnostics.workspace = true
nemo-relay-model-pricing.workspace = true
nemo-relay-observability.workspace = true
nemo-relay-plugin-host.workspace = true
nemo-relay-plugin.workspace = true
nemo-relay-resource-metrics.workspace = true
nemo-relay-runtime.workspace = true
nemo-relay-types.workspace = true

# Third-party dependencies.
opentelemetry = { workspace = true, features = ["trace"] }
opentelemetry_sdk = { workspace = true, features = ["trace"] }
uuid = { workspace = true, features = ["v7", "serde"] }

[dev-dependencies]
# First-party crates.
nemo-relay-logging.workspace = true
nemo-relay-plugin.workspace = true
nemo-relay-resource-metrics.workspace = true
nemo-relay-types.workspace = true
nemo-relay-worker-proto = { workspace = true }

# Third-party dependencies.
arrayvec.workspace = true
async-trait.workspace = true
base64.workspace = true
bitflags = { workspace = true, features = ["serde"] }
chrono = { workspace = true, default-features = true, features = ["serde"] }
circular-buffer.workspace = true
enumset.workspace = true
futures-util.workspace = true
http.workspace = true
http-body.workspace = true
hyper-util = { workspace = true, features = ["tokio"] }
jsonschema.workspace = true
libloading.workspace = true
log = { workspace = true, features = ["kv", "kv_serde"] }
opentelemetry = { workspace = true, features = ["trace", "logs", "metrics"] }
opentelemetry_sdk = { workspace = true, features = ["trace", "logs", "metrics", "testing"] }
percent-encoding.workspace = true
prost.workspace = true
reqwest = { workspace = true, features = ["charset", "http2", "rustls", "stream"] }
ring.workspace = true
schemars = { workspace = true }
semver.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
sha2.workspace = true
shell-words.workspace = true
strum = { workspace = true, features = ["derive"] }
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, default-features = true, features = ["rt", "macros", "sync", "test-util", "rt-multi-thread", "time"] }
tokio-stream = { workspace = true, default-features = true, features = ["net"] }
toml.workspace = true
tonic = { workspace = true, default-features = true, features = ["transport"] }
tower = { workspace = true, features = ["util"] }
typed-builder.workspace = true
uuid = { workspace = true, features = ["v7", "serde"] }
opentelemetry-http.workspace = true
opentelemetry-otlp = { workspace = true, features = ["trace", "logs", "metrics", "http-proto", "http-json", "reqwest-client", "reqwest-rustls", "grpc-tonic", "gzip-http", "gzip-tonic", "zstd-http", "zstd-tonic", "tls-ring", "tls-roots"] }
opentelemetry-semantic-conventions = { workspace = true, features = ["semconv_experimental"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
tokio-tungstenite = { workspace = true, features = ["connect", "rustls-tls-native-roots"] }
sysinfo = { workspace = true, features = ["system", "network"] }
futures.workspace = true
object_store = { workspace = true, features = ["aws"] }
opentelemetry-proto = { workspace = true, features = ["gen-tonic", "logs", "metrics"] }
rcgen.workspace = true
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }

[target.'cfg(unix)'.dev-dependencies]
rustix = { workspace = true, features = ["fs", "param"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[[test]]
name = "plugin_host_builtin_ownership"
path = "tests/integration/plugin_host_builtin_ownership_tests.rs"

[[test]]
name = "embedded_diagnostics_startup"
path = "tests/embedded_diagnostics_startup.rs"
