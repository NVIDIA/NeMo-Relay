[package]
name = "nemo-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core Rust SDK for NeMo Relay observability, scope management, and runtime instrumentation."
readme = "README.md"

[lints]
workspace = true

[features]
default = [
    "guardrails-remote",
    "object-store",
]
atof-streaming = [
    "dep:tokio-tungstenite",
    "tokio/io-util",
    "tokio/net",
    "tokio/rt-multi-thread",
    "tokio/time",
]
schema = ["dep:schemars", "nemo-relay-types/schema"]
# Private test hook for suppressing implicit user/system plugin discovery.
__skip-implicit-config = []
# Deprecated with the built-in NeMo Guardrails integration; scheduled for removal in 0.9.
guardrails-remote = []
object-store = [
    "dep:object_store",
    "tokio/net",
    "tokio/time",
]
worker-grpc = [
    "dep:nemo-relay-worker-proto",
    "dep:hyper-util",
    "dep:tower",
    "tokio-stream/net",
    "tonic/codegen",
    "tonic/router",
    "tonic/transport",
    "tokio/io-util",
    "tokio/net",
    "tokio/process",
    "tokio/rt-multi-thread",
]

[dependencies]
nemo-relay-types.workspace = true
nemo-relay-plugin.workspace = true
nemo-relay-worker-proto = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v7", "serde"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = { version = "0.9" }
schemars = { version = "0.8", optional = true }
chrono = { version = "0.4", features = ["serde"] }
bitflags = { version = "2", features = ["serde"] }
thiserror = "2"
strum = { version = "0.27", features = ["derive"] }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }
typed-builder = "0.23.2"
futures-util = "0.3"
opentelemetry = { workspace = true, features = ["trace", "logs", "metrics"] }
opentelemetry-semantic-conventions.workspace = true
opentelemetry_sdk = { workspace = true, features = ["trace", "logs", "metrics", "internal-logs"] }
tracing = { version = "0.1", default-features = false, features = ["std", "log"] }
libloading = "0.8"
semver = "1"
sha2 = "0.11"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "logs", "metrics", "http-proto", "reqwest-blocking-client", "reqwest-rustls", "grpc-tonic", "tls-ring", "tls-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "rustls-tls-native-roots", "stream"] }
tonic = { version = "0.14.1", default-features = false }
object_store = { version = "0.14.1", default-features = false, features = ["aws"], optional = true }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "rustls-tls-native-roots"], optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
shell-words = "1"
log = { version = "0.4", features = ["kv"] }
spdlog-rs = { version = "0.5", features = ["log", "multi-thread"] }
unicode-general-category = "1.1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "sync", "test-util", "rt-multi-thread", "time"] }
futures = "0.3"
opentelemetry_sdk = { workspace = true, features = ["trace", "logs", "metrics", "testing"] }
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic", "logs", "metrics"] }
prost = "0.14"
tonic = { version = "0.14.1", features = ["transport"] }
tokio-stream = { version = "0.1", features = ["net"] }
serde_json = "1"
object_store = { version = "0.14.1", default-features = false, features = ["aws"] }
tempfile = "3"

[[test]]
name = "codec_integration"
path = "tests/integration/codec_tests.rs"

[[test]]
name = "context_isolation_integration"
path = "tests/integration/context_isolation_tests.rs"

[[test]]
name = "native_plugin_integration"
path = "tests/integration/native_plugin_tests.rs"

[[test]]
name = "plugin_host_builtin_ownership"
path = "tests/integration/plugin_host_builtin_ownership_tests.rs"

[[test]]
name = "worker_plugin_integration"
path = "tests/integration/worker_plugin_tests.rs"
required-features = ["worker-grpc"]

[[test]]
name = "middleware_integration"
path = "tests/integration/middleware_tests.rs"

[[test]]
name = "pipeline_integration"
path = "tests/integration/pipeline_tests.rs"

[[test]]
name = "scope_local_integration"
path = "tests/integration/scope_local_tests.rs"

[[test]]
name = "stream_integration"
path = "tests/integration/stream_tests.rs"

[[test]]
name = "subscriber_dispatcher_integration"
path = "tests/integration/subscriber_dispatcher_tests.rs"

[[test]]
name = "api_surface_integration"
path = "tests/integration/api_surface_tests.rs"

[[test]]
name = "atif_storage_integration"
path = "tests/integration/atif_storage_tests.rs"
required-features = ["object-store"]
