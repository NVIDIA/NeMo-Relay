[package]
name = "nemo-relay-adaptive"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Adaptive runtime primitives and Redis-backed learning components for NeMo Relay."
readme = "README.md"

[lints]
workspace = true

[dependencies]
# First-party crates.
nemo-relay-codecs.workspace = true
nemo-relay-model-pricing.workspace = true
nemo-relay-plugin-host.workspace = true
nemo-relay-runtime.workspace = true
nemo-relay-types.workspace = true

# Third-party dependencies.
chrono = { workspace = true, default-features = true, features = ["serde"] }
log = { workspace = true, features = ["kv"] }
redis = { workspace = true, features = ["tokio-comp", "connection-manager"] }
regex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
sha2.workspace = true
strum = { workspace = true, features = ["derive"] }
tdigest = { workspace = true, features = ["use_serde"] }
thiserror.workspace = true
tokio = { workspace = true, default-features = true, features = ["rt", "macros", "sync", "time"] }
tokio-stream = { workspace = true, features = ["sync"] }
uuid = { workspace = true, features = ["v4", "v7", "serde"] }

[features]
__skip-implicit-config = ["nemo-relay-plugin-host/__skip-implicit-config"]

[dev-dependencies]
# First-party crates.
nemo-relay-logging.workspace = true

# Third-party dependencies.
tokio = { workspace = true, features = ["rt", "macros", "sync", "time", "test-util", "rt-multi-thread"] }

[[test]]
name = "redis_integration"
path = "tests/integration/redis_tests.rs"

[[test]]
name = "runtime_integration"
path = "tests/integration/runtime_integration_tests.rs"

[[test]]
name = "acg_module_surface"
path = "tests/integration/acg_module_surface_tests.rs"

[[test]]
name = "response_cache_integration"
path = "tests/integration/response_cache_tests.rs"

[[test]]
name = "response_cache_benchmark_integration"
path = "tests/integration/response_cache_benchmark_tests.rs"
