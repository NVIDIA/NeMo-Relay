name: Rust

on:
  workflow_call:
    inputs:
      run_package:
        description: 'Whether to build package artifacts'
        required: false
        default: true
        type: boolean
    secrets:
      CODECOV_TOKEN:
        required: false

defaults:
  run:
    shell: bash

env:
  GH_TOKEN: "${{ github.token }}"
  GIT_COMMIT: "${{ github.sha }}"
  NEMO_RELAY_CI_WORKSPACE: "${{ github.workspace }}"
  NEMO_RELAY_CI_WORKSPACE_TMP: "${{ github.workspace }}/tmp"
  UV_PYTHON_DOWNLOADS: never
  UV_PYTHON_PREFERENCE: only-system

jobs:
  Test:
    name: Test (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      redis:
        image: ${{ matrix.redis_service_image }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      s3:
        image: ${{ matrix.s3_service_image }}
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: nemo-relay-atif-ci
        ports:
          - 9090:9090
        options: >-
          --health-cmd "wget --spider -q http://localhost:9090/favicon.ico || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-latest
            run_redis_tests: true
            redis_service_image: redis:7.4.7-alpine@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf
            run_s3_tests: true
            s3_service_image: adobe/s3mock:5.0.0@sha256:c461c8f4234bd63540d2f3a3cabce69d814c78dc890a5af08727525a028e23da
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            run_redis_tests: false
            redis_service_image: ''
            s3_service_image: ''
            run_s3_tests: false
          - platform: macos-arm64
            runner: macos-15
            run_redis_tests: false
            redis_service_image: ''
            s3_service_image: ''
            run_s3_tests: false
          - platform: windows-amd64
            runner: windows-2022
            run_redis_tests: false
            redis_service_image: ''
            s3_service_image: ''
            run_s3_tests: false
          - platform: windows-arm64
            runner: windows-11-arm
            run_redis_tests: false
            redis_service_image: ''
            s3_service_image: ''
            run_s3_tests: false

    steps:
      - name: Remove untrusted Homebrew tap
        if: ${{ runner.os == 'macOS' }}
        run: |
          if [ -d "$(brew --repository aws/tap)" ]; then
            brew untap aws/tap
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load CI tool versions
        id: ci-config
        uses: ./.github/actions/load-ci-tool-versions

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          toolchain: ${{ steps.ci-config.outputs.rust_version }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: nemo-relay-rust-${{ matrix.platform }}-${{ steps.ci-config.outputs.rust_version }}-debug
          workspaces: . -> target
          cache-all-crates: true
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8
        with:
          version: ${{ steps.ci-config.outputs.uv_version }}
          enable-cache: true
          cache-dependency-glob: ${{ env.NEMO_RELAY_CI_WORKSPACE }}/uv.lock

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.ci-config.outputs.default_python_version }}

      - uses: taiki-e/install-action@c070f87102a1c75b3183910f391c1cb887fe13c8 # v2.77.6
        with:
          tool: cargo-llvm-cov@${{ steps.ci-config.outputs.cargo_llvm_cov_version }},cargo-nextest@${{ steps.ci-config.outputs.cargo_nextest_version }},just@${{ steps.ci-config.outputs.just_version }}

      - name: Run Rust tests with coverage
        working-directory: ${{ env.NEMO_RELAY_CI_WORKSPACE }}
        run: |
          set -e
          args=(
            --set ci true
            --set output_dir "${{ github.workspace }}"
          )
          if [ "${{ matrix.run_redis_tests }}" = "true" ]; then
            export NEMO_RELAY_RUN_REDIS_TESTS=1
          fi
          if [ "${{ matrix.run_s3_tests }}" = "true" ]; then
            export NEMO_RELAY_RUN_S3_TESTS=1
            export NEMO_RELAY_S3_TEST_BUCKET=nemo-relay-atif-ci
            export AWS_ACCESS_KEY_ID=nemo-relay
            export AWS_SECRET_ACCESS_KEY=nemo-relay
            export AWS_REGION=us-east-1
            export AWS_ENDPOINT_URL=http://127.0.0.1:9090
            export AWS_ALLOW_HTTP=true
            export AWS_VIRTUAL_HOSTED_STYLE_REQUEST=false
          fi
          just "${args[@]}" test-rust

      - name: Upload Rust coverage to Codecov
        if: ${{ matrix.platform != 'windows-arm64' }}
        uses: codecov/codecov-action@e53489f4d376d79066609109e7a95a29eb3740b1 # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          files: rust-workspace.xml
          flags: rust-${{ matrix.platform }}
          name: rust-${{ matrix.platform }}
          verbose: true

  Package:
    name: Package (${{ matrix.platform }})
    if: ${{ inputs.run_package }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - &package-linux-amd64
            platform: linux-amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build_image: quay.io/pypa/manylinux2014_x86_64@sha256:35baef377f64c2ae2e7ed647917ecd090c50f6e8b06fd605012661c2e954cc92
            runtime_image: quay.io/pypa/manylinux2014_x86_64@sha256:35baef377f64c2ae2e7ed647917ecd090c50f6e8b06fd605012661c2e954cc92
          - &package-linux-arm64
            platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            build_image: quay.io/pypa/manylinux2014_aarch64@sha256:63f73ecd2be3ad7cf66a402c72c1594b3f9140e263ab6838896e93a8fbf53794
            runtime_image: quay.io/pypa/manylinux2014_aarch64@sha256:63f73ecd2be3ad7cf66a402c72c1594b3f9140e263ab6838896e93a8fbf53794
          - &package-linux-musl-amd64
            platform: linux-musl-amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build_image: ''
            runtime_image: quay.io/pypa/musllinux_1_2_x86_64@sha256:7b54360b191356838f6e41d4b9820c69be4f3d8dc8e7bca26f2684d48e5c8633
          - &package-linux-musl-arm64
            platform: linux-musl-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            build_image: ''
            runtime_image: quay.io/pypa/musllinux_1_2_aarch64@sha256:274a947b4d5d745b56b868b0d052641e0798a652e3e65755987edf60547d1268
          - &package-macos-arm64
            platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            build_image: ''
            runtime_image: ''
          - &package-windows-amd64
            platform: windows-amd64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            build_image: ''
            runtime_image: ''
          - &package-windows-arm64
            platform: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            build_image: ''
            runtime_image: ''

    steps:
      - name: Remove untrusted Homebrew tap
        if: ${{ runner.os == 'macOS' }}
        run: |
          if [ -d "$(brew --repository aws/tap)" ]; then
            brew untap aws/tap
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load CI tool versions
        id: ci-config
        uses: ./.github/actions/load-ci-tool-versions

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          toolchain: ${{ steps.ci-config.outputs.rust_version }}
          target: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: nemo-relay-rust-${{ matrix.platform }}-${{ steps.ci-config.outputs.rust_version }}-release
          workspaces: . -> target
          cache-all-crates: true
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8
        with:
          version: ${{ steps.ci-config.outputs.uv_version }}

      - uses: taiki-e/install-action@c070f87102a1c75b3183910f391c1cb887fe13c8 # v2.77.6
        with:
          tool: just@${{ steps.ci-config.outputs.just_version }}

      - name: Fetch locked Rust dependencies
        working-directory: ${{ env.NEMO_RELAY_CI_WORKSPACE }}
        run: cargo fetch --locked --target "${{ matrix.target }}"

      - name: Set CLI binary version
        working-directory: ${{ env.NEMO_RELAY_CI_WORKSPACE }}
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          version="$REF_NAME"
          if [[ "$REF_TYPE" != "tag" ]]; then
            version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)+${GIT_COMMIT::8}"
          fi
          just set-cargo-version "$version"
          # Refresh workspace package versions without changing resolved dependencies.
          cargo metadata --offline --format-version 1 > /dev/null
          printf 'NEMO_RELAY_CLI_PACKAGE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"

      - name: Install musl tools
        if: ${{ startsWith(matrix.target, 'x86_64-unknown-linux-musl') || startsWith(matrix.target, 'aarch64-unknown-linux-musl') }}
        run: |
          set -euo pipefail
          if [ "${{ runner.arch }}" = "ARM64" ]; then
            for sources in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
              if [ -f "$sources" ]; then
                sudo sed -i 's|http://ports.ubuntu.com/ubuntu-ports|https://ports.ubuntu.com/ubuntu-ports|g' "$sources"
              fi
            done
          fi
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y musl-tools

      - name: Build CLI release binary
        if: ${{ matrix.build_image == '' }}
        working-directory: ${{ env.NEMO_RELAY_CI_WORKSPACE }}
        run: |
          set -e
          # SONAR_IGNORE_START: dependencies were fetched from Cargo.lock before dynamic package metadata is applied.
          cargo build --locked --offline --release --target "${{ matrix.target }}" -p nemo-relay-cli
          # SONAR_IGNORE_END

      - name: Build CLI release binary in manylinux
        if: ${{ matrix.build_image != '' }}
        working-directory: ${{ env.NEMO_RELAY_CI_WORKSPACE }}
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "${{ env.NEMO_RELAY_CI_WORKSPACE }}:${{ env.NEMO_RELAY_CI_WORKSPACE }}" \
            --workdir "${{ env.NEMO_RELAY_CI_WORKSPACE }}" \
            --env NEMO_RELAY_RUST_VERSION="${{ steps.ci-config.outputs.rust_version }}" \
            "${{ matrix.build_image }}" \
            /bin/bash -ec '
              curl --proto "=https" --tlsv1.2 --silent --show-error --fail https://sh.rustup.rs | \
                sh -s -- -y --profile minimal --default-toolchain "$NEMO_RELAY_RUST_VERSION"
              export PATH="$HOME/.cargo/bin:$PATH"
              cargo build --locked --release --target "${{ matrix.target }}" -p nemo-relay-cli
            '

      - name: Stage CLI binary artifact
        working-directory: ${{ env.NEMO_RELAY_CI_WORKSPACE }}
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          version="${{ github.ref_name }}"
          if [ "${{ github.ref_type }}" != "tag" ]; then
            version="dev-${GIT_COMMIT::8}"
          fi
          binary="nemo-relay"
          asset="nemo-relay-cli-${target}-${version}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            binary="${binary}.exe"
            asset="${asset}.exe"
          fi
          source="${NEMO_RELAY_CI_WORKSPACE}/target/${target}/release/${binary}"
          if [ ! -f "$source" ]; then
            echo "Error: expected CLI binary at ${source}" >&2
            exit 1
          fi
          rm -rf "${NEMO_RELAY_CI_WORKSPACE_TMP}/cli"
          mkdir -p "${NEMO_RELAY_CI_WORKSPACE_TMP}/cli"
          cp "$source" "${NEMO_RELAY_CI_WORKSPACE_TMP}/cli/${asset}"

      - name: Package CLI binary for PyPI
        working-directory: ${{ env.NEMO_RELAY_CI_WORKSPACE }}
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          binary="nemo-relay"
          if [ "${{ runner.os }}" = "Windows" ]; then
            binary="${binary}.exe"
          fi
          source="${NEMO_RELAY_CI_WORKSPACE}/target/${target}/release/${binary}"
          version="$NEMO_RELAY_CLI_PACKAGE_VERSION"
          rm -rf "${NEMO_RELAY_CI_WORKSPACE_TMP}/cli-packages"
          mkdir -p "${NEMO_RELAY_CI_WORKSPACE_TMP}/cli-packages"
          python scripts/package-cli-bin.py \
            --binary "$source" \
            --target "$target" \
            --version "$version" \
            --output-dir "${NEMO_RELAY_CI_WORKSPACE_TMP}/cli-packages"

      - name: Upload CLI binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cli-binary-${{ matrix.platform }}
          path: ${{ env.NEMO_RELAY_CI_WORKSPACE_TMP }}/cli/*
          if-no-files-found: error

      - name: Upload CLI wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cli-python-wheel-${{ matrix.platform }}
          path: ${{ env.NEMO_RELAY_CI_WORKSPACE_TMP }}/cli-packages/*.whl
          if-no-files-found: error

  PackageSmoke:
    name: Package smoke (${{ matrix.platform }})
    needs: [Package]
    if: ${{ inputs.run_package && !cancelled() && needs.Package.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - *package-linux-amd64
          - *package-linux-arm64
          - *package-linux-musl-amd64
          - *package-linux-musl-arm64
          - *package-macos-arm64
          - *package-windows-amd64
          - *package-windows-arm64

    steps:
      - name: Remove untrusted Homebrew tap
        if: ${{ runner.os == 'macOS' }}
        run: |
          if [ -d "$(brew --repository aws/tap)" ]; then
            brew untap aws/tap
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load CI tool versions
        id: ci-config
        uses: ./.github/actions/load-ci-tool-versions

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8
        if: ${{ matrix.runtime_image == '' }}
        with:
          version: ${{ steps.ci-config.outputs.uv_version }}

      - name: Set up Python
        if: ${{ matrix.runtime_image == '' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.ci-config.outputs.default_python_version }}

      - name: Download matching CLI binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-binary-${{ matrix.platform }}
          path: cli-binary/

      - name: Download matching CLI wheel artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-python-wheel-${{ matrix.platform }}
          path: cli-wheel/

      - name: Run downloaded CLI binary and wheel
        if: ${{ matrix.runtime_image == '' }}
        run: |
          set -euo pipefail
          binary="$(find cli-binary -maxdepth 1 -type f -print -quit)"
          wheel="$(find cli-wheel -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$binary"
          test -n "$wheel"
          chmod +x "$binary"
          binary_version="$("$binary" --version)"
          uv venv --python "$(uv python find)" "${RUNNER_TEMP}/nemo-relay-cli-venv"
          if [ "${{ runner.os }}" = "Windows" ]; then
            venv_python="${RUNNER_TEMP}/nemo-relay-cli-venv/Scripts/python.exe"
            venv_cli="${RUNNER_TEMP}/nemo-relay-cli-venv/Scripts/nemo-relay.exe"
          else
            venv_python="${RUNNER_TEMP}/nemo-relay-cli-venv/bin/python"
            venv_cli="${RUNNER_TEMP}/nemo-relay-cli-venv/bin/nemo-relay"
          fi
          # SONAR_IGNORE_START: local wheel with no dependencies or index access.
          uv pip install --python "$venv_python" --no-deps --no-index "$wheel"
          # SONAR_IGNORE_END
          wheel_version="$("$venv_cli" --version)"
          if [ "$binary_version" != "$wheel_version" ]; then
            echo "Error: CLI binary reports '$binary_version' but wheel reports '$wheel_version'" >&2
            exit 1
          fi

      - name: Run downloaded CLI binary and wheel in Linux runtime container
        if: ${{ matrix.runtime_image != '' }}
        env:
          RUNTIME_IMAGE: ${{ matrix.runtime_image }}
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "${{ github.workspace }}:${{ github.workspace }}" \
            --workdir "${{ github.workspace }}" \
            "$RUNTIME_IMAGE" \
            /bin/sh -ec '
              binary="$(find cli-binary -maxdepth 1 -type f -print -quit)"
              wheel="$(find cli-wheel -maxdepth 1 -name "*.whl" -print -quit)"
              test -n "$binary"
              test -n "$wheel"
              chmod +x "$binary"
              binary_version="$("$binary" --version)"
              /opt/python/cp311-cp311/bin/python -m venv /tmp/nemo-relay-cli-venv
              /tmp/nemo-relay-cli-venv/bin/python -m pip install --no-deps "$wheel"
              wheel_version="$(/tmp/nemo-relay-cli-venv/bin/nemo-relay --version)"
              if [ "$binary_version" != "$wheel_version" ]; then
                echo "Error: CLI binary and wheel versions differ" >&2
                exit 1
              fi
            '
