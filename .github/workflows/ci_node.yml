name: Node.js

on:
  workflow_call:
    inputs:
      ref_type:
        description: 'The ref type from the triggering workflow'
        required: true
        type: string
      ref_name:
        description: 'The ref name from the triggering workflow'
        required: true
        type: string
      run_package:
        description: 'Whether to build package artifacts'
        required: false
        default: true
        type: boolean
      run_openclaw:
        description: 'Whether to run OpenClaw integration checks'
        required: false
        default: false
        type: boolean
      run_pi:
        description: 'Whether to run pi integration checks'
        required: false
        default: false
        type: boolean
    secrets:
      CODECOV_TOKEN:
        required: false

defaults:
  run:
    shell: bash

env:
  GH_TOKEN: "${{ github.token }}"
  GIT_COMMIT: "${{ github.sha }}"
  NEMO_RELAY_CI_WORKSPACE: "${{ github.workspace }}"
  NEMO_RELAY_CI_WORKSPACE_TMP: "${{ github.workspace }}/tmp"
  UV_PYTHON_DOWNLOADS: never
  UV_PYTHON_PREFERENCE: only-system

jobs:
  Test:
    name: Test (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - &linux-amd64
            platform: linux-amd64
            node_build_strategy: zig
            node_target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - &linux-arm64
            platform: linux-arm64
            node_build_strategy: zig
            node_target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - &macos-arm64
            platform: macos-arm64
            node_build_strategy: native
            node_target: ""
            runner: macos-15
          - &windows-amd64
            platform: windows-amd64
            node_build_strategy: native
            node_target: ""
            runner: windows-2022
          - &windows-arm64
            platform: windows-arm64
            node_build_strategy: native
            node_target: ""
            runner: windows-11-arm

    steps:
      - name: Remove untrusted Homebrew tap
        if: ${{ runner.os == 'macOS' }}
        run: |
          if [ -d "$(brew --repository aws/tap)" ]; then
            brew untap aws/tap
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load CI tool versions
        id: ci-config
        uses: ./.github/actions/load-ci-tool-versions

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          toolchain: ${{ steps.ci-config.outputs.rust_version }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: nemo-relay-rust-${{ matrix.platform }}-${{ steps.ci-config.outputs.rust_version }}-debug
          workspaces: . -> target
          cache-all-crates: true
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@c070f87102a1c75b3183910f391c1cb887fe13c8 # v2.77.6
        with:
          tool: cargo-llvm-cov@${{ steps.ci-config.outputs.cargo_llvm_cov_version }},cargo-nextest@${{ steps.ci-config.outputs.cargo_nextest_version }},just@${{ steps.ci-config.outputs.just_version }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.ci-config.outputs.node_version }}

      - name: Run Node tests with coverage
        working-directory: ${{ env.NEMO_RELAY_CI_WORKSPACE }}
        run: just --set ci true --set output_dir "${{ github.workspace }}" test-node

      - name: Run OpenClaw integration checks
        if: ${{ inputs.run_openclaw }}
        working-directory: ${{ env.NEMO_RELAY_CI_WORKSPACE }}
        run: just --set ci true test-openclaw

      - name: Run pi integration checks
        if: ${{ inputs.run_pi }}
        working-directory: ${{ env.NEMO_RELAY_CI_WORKSPACE }}
        run: just --set ci true test-pi

      - name: Upload Node coverage to Codecov
        uses: codecov/codecov-action@e53489f4d376d79066609109e7a95a29eb3740b1 # v7.0.0
        if: ${{ !startsWith(matrix.platform, 'windows') }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          files: node-coverage.xml,node-rust.xml
          flags: node-${{ matrix.platform }}
          name: node-${{ matrix.platform }}
          verbose: true

  Package:
    name: Package (${{ matrix.platform }})
    if: ${{ inputs.run_package }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - *linux-amd64
          - *linux-arm64
          - *macos-arm64
          - *windows-amd64
          - *windows-arm64
          - &package-linux-musl-amd64
            node_arch: x64
            node_build_strategy: zig
            node_target: x86_64-unknown-linux-musl
            platform: linux-musl-amd64
            runner: ubuntu-latest
            container_image: node:24-alpine3.22@sha256:191c9f0080fcbbc6547a85dc0ff7988072214a355aabdc1d2ec55a7dae5eea8a
            package_name: nemo-relay-node-linux-x64-musl
          - &package-linux-musl-arm64
            node_arch: arm64
            node_build_strategy: zig
            node_target: aarch64-unknown-linux-musl
            platform: linux-musl-arm64
            runner: ubuntu-24.04-arm
            container_image: node:24-alpine3.22@sha256:191c9f0080fcbbc6547a85dc0ff7988072214a355aabdc1d2ec55a7dae5eea8a
            package_name: nemo-relay-node-linux-arm64-musl

    steps:
      - name: Remove untrusted Homebrew tap
        if: ${{ runner.os == 'macOS' }}
        run: |
          if [ -d "$(brew --repository aws/tap)" ]; then
            brew untap aws/tap
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load CI tool versions
        id: ci-config
        uses: ./.github/actions/load-ci-tool-versions

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          toolchain: ${{ steps.ci-config.outputs.rust_version }}

      - name: Install Node Rust target
        if: ${{ startsWith(matrix.platform, 'linux-') }}
        run: rustup target add ${{ matrix.node_target }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: nemo-relay-rust-${{ matrix.platform }}-${{ steps.ci-config.outputs.rust_version }}-release
          workspaces: . -> target
          cache-all-crates: true
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8
        if: ${{ startsWith(matrix.platform, 'linux-') }}
        with:
          version: ${{ steps.ci-config.outputs.uv_version }}
          enable-cache: true
          cache-dependency-glob: ${{ env.NEMO_RELAY_CI_WORKSPACE }}/uv.lock

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.ci-config.outputs.node_version }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.ci-config.outputs.default_python_version }}

      - uses: taiki-e/install-action@c070f87102a1c75b3183910f391c1cb887fe13c8 # v2.77.6
        with:
          tool: just@${{ steps.ci-config.outputs.just_version }}

      - name: Create packaging output directory
        run: |
          set -e
          mkdir -p "${{ env.NEMO_RELAY_CI_WORKSPACE_TMP }}/npm"

      - name: Derive Node package version
        working-directory: ${{ env.NEMO_RELAY_CI_WORKSPACE }}
        run: |
          set -e
          version="$(node -e 'const fs = require("fs"); const pkg = JSON.parse(fs.readFileSync("crates/node/package.json", "utf8")); if (!pkg.version) { throw new Error("crates/node/package.json missing version field"); } console.log(pkg.version);')"
          sha="${GITHUB_SHA::8}"
          if [ "${{ inputs.ref_type }}" = "tag" ]; then
            version="${{ inputs.ref_name }}"
          else
            version="${version}+${sha}"
          fi
          printf 'NEMO_RELAY_PACKAGE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"

      - name: Package Node
        working-directory: ${{ env.NEMO_RELAY_CI_WORKSPACE }}
        run: |
          set -e
          just \
            --set ci true \
            --set output_dir "${{ env.NEMO_RELAY_CI_WORKSPACE_TMP }}" \
            --set node_platform "${{ matrix.platform }}" \
            --set node_target "${{ matrix.node_target }}" \
            --set node_build_strategy "${{ matrix.node_build_strategy }}" \
            --set ref_name "${NEMO_RELAY_PACKAGE_VERSION}" \
            package-node

      - name: Upload split Node npm package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: node-npm-package-${{ matrix.platform }}
          path: ${{ env.NEMO_RELAY_CI_WORKSPACE_TMP }}/npm/*.tgz
          if-no-files-found: error

  PackageOpenClaw:
    name: Package OpenClaw plugin
    if: ${{ inputs.run_openclaw }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load CI tool versions
        id: ci-config
        uses: ./.github/actions/load-ci-tool-versions

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          toolchain: ${{ steps.ci-config.outputs.rust_version }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: nemo-relay-rust-linux-amd64-${{ steps.ci-config.outputs.rust_version }}-debug
          workspaces: . -> target
          cache-all-crates: true
          cache-bin: false
          save-if: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.ci-config.outputs.node_version }}

      - uses: taiki-e/install-action@c070f87102a1c75b3183910f391c1cb887fe13c8 # v2.77.6
        with:
          tool: just@${{ steps.ci-config.outputs.just_version }}

      - name: Derive OpenClaw package version
        working-directory: ${{ env.NEMO_RELAY_CI_WORKSPACE }}
        run: |
          set -e
          version="$(node -e 'const fs = require("fs"); const pkg = JSON.parse(fs.readFileSync("integrations/openclaw/package.json", "utf8")); if (!pkg.version) { throw new Error("integrations/openclaw/package.json missing version field"); } console.log(pkg.version);')"
          sha="${GITHUB_SHA::8}"
          if [ "${{ inputs.ref_type }}" = "tag" ]; then
            version="${{ inputs.ref_name }}"
          else
            version="${version}+${sha}"
          fi
          printf 'NEMO_RELAY_OPENCLAW_PACKAGE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"

      - name: Package OpenClaw plugin
        working-directory: ${{ env.NEMO_RELAY_CI_WORKSPACE }}
        run: |
          set -euo pipefail
          just \
            --set ci true \
            --set output_dir "${NEMO_RELAY_CI_WORKSPACE_TMP}" \
            --set ref_name "${NEMO_RELAY_OPENCLAW_PACKAGE_VERSION}" \
            package-openclaw

      - name: Upload OpenClaw plugin artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: openclaw-npm
          path: ${{ env.NEMO_RELAY_CI_WORKSPACE_TMP }}/openclaw/*.tgz
          if-no-files-found: error

  PackageSmoke:
    name: Package smoke (${{ matrix.platform }})
    needs: [Package]
    if: ${{ inputs.run_package && !cancelled() && needs.Package.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - *linux-amd64
          - *linux-arm64
          - *macos-arm64
          - *windows-amd64
          - *windows-arm64
          - *package-linux-musl-amd64
          - *package-linux-musl-arm64
    steps:
      - name: Remove untrusted Homebrew tap
        if: ${{ runner.os == 'macOS' }}
        run: |
          if [ -d "$(brew --repository aws/tap)" ]; then
            brew untap aws/tap
          fi

      - name: Checkout
        if: ${{ !contains(matrix.platform, 'musl') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load CI tool versions
        if: ${{ !contains(matrix.platform, 'musl') }}
        id: ci-config
        uses: ./.github/actions/load-ci-tool-versions

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ !contains(matrix.platform, 'musl') }}
        with:
          node-version: ${{ steps.ci-config.outputs.node_version }}

      - name: Download Node metapackage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: node-npm-package-linux-amd64
          path: node-metapackage/

      - name: Download matching Node native package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: node-npm-package-${{ matrix.platform }}
          path: node-native/

      - name: Install and load split Node package
        if: ${{ !contains(matrix.platform, 'musl') }}
        run: |
          set -euo pipefail
          mkdir package-smoke
          cd package-smoke
          npm init --yes >/dev/null
          metapackage=(../node-metapackage/nemo-relay-node-npm-[0-9]*.tgz)
          native=(../node-native/nemo-relay-node-npm-*-*-[0-9]*.tgz)
          npm install --ignore-scripts "${native[0]}" "${metapackage[0]}"
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const { readdirSync } = require('node:fs');
          const nativePackages = readdirSync('node_modules').filter(
            (name) => name.startsWith('nemo-relay-node-') && name !== 'nemo-relay-node',
          );
          assert.equal(nativePackages.length, 1);
          for (const entrypoint of [
            'nemo-relay-node',
            'nemo-relay-node/typed',
            'nemo-relay-node/plugin',
            'nemo-relay-node/adaptive',
            'nemo-relay-node/observability',
            'nemo-relay-node/pii_redaction',
            'nemo-relay-node/model_pricing',
          ]) {
            require(entrypoint);
          }
          NODE

      - name: Install and load musllinux split Node package
        if: ${{ contains(matrix.platform, 'musl') }}
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "${{ github.workspace }}:${{ github.workspace }}" \
            --workdir "${{ github.workspace }}" \
            --env NEMO_RELAY_NODE_PACKAGE_NAME="${{ matrix.package_name }}" \
            --env NEMO_RELAY_WORKSPACE="${{ github.workspace }}" \
            "${{ matrix.container_image }}" \
            sh -ceu '
              smoke_dir="$(mktemp -d)"
              trap "rm -rf $smoke_dir" EXIT
              cd "$smoke_dir"
              npm init --yes >/dev/null
              metapackage="$(find "$NEMO_RELAY_WORKSPACE/node-metapackage" -name "nemo-relay-node-npm-[0-9]*.tgz" -print -quit)"
              native_count="$(find "$NEMO_RELAY_WORKSPACE/node-native" -name "nemo-relay-node-npm-*-*-[0-9]*.tgz" | wc -l)"
              test "$native_count" -eq 1
              native="$(find "$NEMO_RELAY_WORKSPACE/node-native" -name "nemo-relay-node-npm-*-*-[0-9]*.tgz" -print -quit)"
              test -n "$metapackage"
              test -n "$native"
              npm install --ignore-scripts "$native" "$metapackage"
              node -e "
                const assert = require(\"node:assert/strict\");
                const { readdirSync } = require(\"node:fs\");
                const manifest = require(process.env.NEMO_RELAY_NODE_PACKAGE_NAME + \"/package.json\");
                const nativePackages = readdirSync(\"node_modules\").filter(
                  (name) => name.startsWith(\"nemo-relay-node-\") && name !== \"nemo-relay-node\",
                );
                assert.equal(nativePackages.length, 1);
                assert.deepEqual(manifest.libc, [\"musl\"]);
                for (const entrypoint of [
                  \"nemo-relay-node\",
                  \"nemo-relay-node/typed\",
                  \"nemo-relay-node/plugin\",
                  \"nemo-relay-node/adaptive\",
                  \"nemo-relay-node/observability\",
                  \"nemo-relay-node/pii_redaction\",
                  \"nemo-relay-node/model_pricing\",
                ]) {
                  require(entrypoint);
                }
              "
            '
