name: Release Native Plugin ABI

on:
  push:
    tags:
      - 'native-abi/*'

permissions:
  contents: read

concurrency:
  group: native-abi-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (${{ matrix.runner }})
    if: ${{ github.repository == 'NVIDIA/NeMo-Relay' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15, windows-2022, windows-11-arm]
    defaults:
      run:
        shell: bash
    env:
      ABI_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load CI tool versions
        id: ci-config
        uses: ./.github/actions/load-ci-tool-versions
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          toolchain: ${{ steps.ci-config.outputs.rust_version }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.ci-config.outputs.default_python_version }}
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8
        with:
          version: ${{ steps.ci-config.outputs.uv_version }}
      - uses: taiki-e/install-action@c070f87102a1c75b3183910f391c1cb887fe13c8 # v2.77.6
        with:
          tool: just@${{ steps.ci-config.outputs.just_version }}
      - name: Check source version and SDK pin
        run: just check-native-abi-release "${ABI_TAG#native-abi/}"
      - name: Prepare binary compatibility fixtures
        run: just build-native-abi-test-fixtures
      - name: Test binary compatibility and SDK execution
        run: |
          cargo test --locked -p nemo-relay-plugin-abi
          cargo test --locked -p nemo-relay-plugin --test abi_value --test abi_executor --test checked_export
      - name: Verify package
        run: cargo package --locked -p nemo-relay-plugin-abi
      - name: Check unchanged binaries across Rust toolchains
        run: |
          source .github/ci-tool-versions.env
          rustup toolchain install "$NEMO_RELAY_CI_NATIVE_ABI_FIXTURE_RUST_VERSION" --profile minimal
          just test-native-abi-toolchains "$NEMO_RELAY_CI_NATIVE_ABI_FIXTURE_RUST_VERSION"

  publish:
    name: Publish Native Plugin ABI
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates.io
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    env:
      ABI_TAG: ${{ github.ref_name }}
      NATIVE_ABI_BOOTSTRAP_TOKEN: ${{ secrets.NATIVE_ABI_BOOTSTRAP_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load CI tool versions
        id: ci-config
        uses: ./.github/actions/load-ci-tool-versions
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          toolchain: ${{ steps.ci-config.outputs.rust_version }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.ci-config.outputs.default_python_version }}
      - name: Check release version
        run: python scripts/native_abi_release.py check "${ABI_TAG#native-abi/}"
      - name: Authenticate to crates.io
        if: ${{ env.NATIVE_ABI_BOOTSTRAP_TOKEN == '' }}
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish the independent interface
        env:
          CARGO_REGISTRY_TOKEN: ${{ env.NATIVE_ABI_BOOTSTRAP_TOKEN || steps.crates-io-auth.outputs.token }}
        run: |
          set -euo pipefail
          version="${ABI_TAG#native-abi/}"
          if cargo info "nemo-relay-plugin-abi@$version" --registry crates-io >/dev/null 2>&1; then
            echo "nemo-relay-plugin-abi $version is already published"
          else
            cargo publish --locked --package nemo-relay-plugin-abi
          fi
