name: Languages

on:
  workflow_call:
    inputs:
      ref_type:
        description: 'The ref type from the triggering workflow'
        required: true
        type: string
      ref_name:
        description: 'The ref name from the triggering workflow'
        required: true
        type: string
      run_rust:
        description: 'Whether Rust tests should run'
        required: false
        default: false
        type: boolean
      run_rust_package:
        description: 'Whether Rust packages should be built'
        required: false
        default: false
        type: boolean
      run_python:
        description: 'Whether Python tests should run'
        required: false
        default: false
        type: boolean
      run_python_package:
        description: 'Whether Python packages should be built'
        required: false
        default: false
        type: boolean
      run_python_integration_langchain:
        description: 'Whether LangChain, LangGraph, and DeepAgents integration tests should run'
        required: false
        default: false
        type: boolean
      run_node:
        description: 'Whether Node.js tests should run'
        required: false
        default: false
        type: boolean
      run_node_package:
        description: 'Whether Node.js packages should be built'
        required: false
        default: false
        type: boolean
      run_openclaw:
        description: 'Whether OpenClaw tests and packaging should run'
        required: false
        default: false
        type: boolean
      run_go:
        description: 'Whether Go tests should run'
        required: false
        default: false
        type: boolean
    secrets:
      CODECOV_TOKEN:
        required: false

defaults:
  run:
    shell: bash

env:
  GIT_COMMIT: "${{ github.sha }}"
  NEMO_RELAY_CI_WORKSPACE: "${{ github.workspace }}"
  NEMO_RELAY_CI_WORKSPACE_TMP: "${{ github.workspace }}/tmp"
  UV_PYTHON_DOWNLOADS: never
  UV_PYTHON_PREFERENCE: only-system

jobs:
  Test:
    name: Test (${{ matrix.platform }})
    if: ${{ inputs.run_rust || inputs.run_python || inputs.run_python_integration_langchain || inputs.run_node || inputs.run_openclaw || inputs.run_go }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    services:
      redis:
        image: ${{ inputs.run_rust && matrix.redis_service_image || '' }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      s3:
        image: ${{ inputs.run_rust && matrix.s3_service_image || '' }}
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: nemo-relay-atif-ci
        ports:
          - 9090:9090
        options: >-
          --health-cmd "wget --spider -q http://localhost:9090/favicon.ico || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-latest
            run_redis_tests: true
            redis_service_image: redis:7.4.7-alpine@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf
            run_s3_tests: true
            s3_service_image: adobe/s3mock:5.0.0@sha256:c461c8f4234bd63540d2f3a3cabce69d814c78dc890a5af08727525a028e23da
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            run_redis_tests: false
            redis_service_image: ''
            run_s3_tests: false
            s3_service_image: ''
          - platform: macos-arm64
            runner: macos-15
            run_redis_tests: false
            redis_service_image: ''
            run_s3_tests: false
            s3_service_image: ''
          - platform: windows-amd64
            runner: windows-2022
            run_redis_tests: false
            redis_service_image: ''
            run_s3_tests: false
            s3_service_image: ''
          - platform: windows-arm64
            runner: windows-11-arm
            run_redis_tests: false
            redis_service_image: ''
            run_s3_tests: false
            s3_service_image: ''

    steps:
      - name: Remove untrusted Homebrew tap
        id: homebrew-cleanup
        if: ${{ runner.os == 'macOS' }}
        continue-on-error: true
        run: |
          if [ -d "$(brew --repository aws/tap)" ]; then
            brew untap aws/tap
          fi

      - name: Checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Load CI tool versions
        id: ci-config
        if: ${{ always() }}
        continue-on-error: true
        uses: ./.github/actions/load-ci-tool-versions

      - name: Set up Rust
        id: rust-setup
        if: ${{ always() }}
        continue-on-error: true
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1.15.4
        with:
          cache: false
          toolchain: ${{ steps.ci-config.outputs.rust_version }}

      - name: Restore Rust test cache
        id: rust-cache
        if: ${{ always() }}
        continue-on-error: true
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: nemo-relay-rust-${{ matrix.platform }}-${{ steps.ci-config.outputs.rust_version }}-coverage-debug
          workspaces: . -> target
          cache-all-crates: true
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up uv
        id: uv-setup
        if: ${{ always() && (inputs.run_rust || inputs.run_python || inputs.run_python_integration_langchain) }}
        continue-on-error: true
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8
        with:
          version: ${{ steps.ci-config.outputs.uv_version }}
          enable-cache: true
          cache-dependency-glob: ${{ env.NEMO_RELAY_CI_WORKSPACE }}/uv.lock

      - name: Set up Python
        id: python-setup
        if: ${{ always() && (inputs.run_rust || inputs.run_python || inputs.run_python_integration_langchain) }}
        continue-on-error: true
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.ci-config.outputs.default_python_version }}

      - name: Set up Node.js
        id: node-setup
        if: ${{ always() && (inputs.run_node || inputs.run_openclaw) }}
        continue-on-error: true
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: ${{ steps.ci-config.outputs.node_version }}

      - name: Set up Go
        id: go-setup
        if: ${{ always() && inputs.run_go }}
        continue-on-error: true
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ steps.ci-config.outputs.go_version }}
          cache: false

      - name: Install test tools
        id: tools-setup
        if: ${{ always() }}
        continue-on-error: true
        uses: taiki-e/install-action@c070f87102a1c75b3183910f391c1cb887fe13c8 # v2.77.6
        with:
          tool: cargo-llvm-cov@${{ steps.ci-config.outputs.cargo_llvm_cov_version }},cargo-nextest@${{ steps.ci-config.outputs.cargo_nextest_version }},just@${{ steps.ci-config.outputs.just_version }}

      - name: Prepare combined Rust coverage
        id: coverage-setup
        if: >-
          ${{
            always()
            && matrix.platform != 'windows-arm64'
            && steps.checkout.outcome == 'success'
            && steps.rust-setup.outcome == 'success'
            && steps.tools-setup.outcome == 'success'
          }}
        continue-on-error: true
        working-directory: ${{ env.NEMO_RELAY_CI_WORKSPACE }}
        run: |
          set -euo pipefail
          coverage_env="$RUNNER_TEMP/nemo-relay-llvm-cov.sh"
          if command -v cygpath >/dev/null 2>&1; then
            coverage_env="$(cygpath -u "$coverage_env")"
          fi
          cargo llvm-cov show-env --sh > "$coverage_env"
          cargo llvm-cov clean --profraw-only
          {
            echo "BASH_ENV=$coverage_env"
            echo "NEMO_RELAY_CI_COVERAGE_SESSION=true"
            echo "NEMO_RELAY_DEFER_RUST_COVERAGE=true"
          } >> "$GITHUB_ENV"

      - name: Compile test artifacts
        id: test-compile
        if: >-
          ${{
            always()
            && steps.checkout.outcome == 'success'
            && steps.rust-setup.outcome == 'success'
            && steps.tools-setup.outcome == 'success'
            && (matrix.platform == 'windows-arm64' || steps.coverage-setup.outcome == 'success')
          }}
        continue-on-error: true
        working-directory: ${{ env.NEMO_RELAY_CI_WORKSPACE }}
        env:
          PLATFORM: ${{ matrix.platform }}
          RUN_RUST: ${{ inputs.run_rust }}
          RUN_PYTHON: ${{ inputs.run_python || inputs.run_python_integration_langchain }}
          RUN_NODE: ${{ inputs.run_node || inputs.run_openclaw }}
          RUN_OPENCLAW: ${{ inputs.run_openclaw }}
          RUN_GO: ${{ inputs.run_go }}
        run: |
          set -uo pipefail
          failed=false
          fixtures=success
          language_native=skipped
          native=skipped
          node_dependencies=skipped
          rust=skipped
          python=skipped
          python_plugin=skipped
          node=skipped
          openclaw=skipped
          go=skipped

          compile() {
            local output="$1"
            shift
            if "$@"; then
              printf -v "$output" '%s' success
            else
              printf -v "$output" '%s' failure
              failed=true
            fi
          }

          if [[ "$RUN_RUST" == "true" || "$RUN_PYTHON" == "true" || "$RUN_GO" == "true" ]]; then
            compile fixtures just build-test-plugin-fixtures
          fi
          if [[ "$RUN_PYTHON" == "true" ]]; then
            compile python just --set ci true build-python
          fi

          language_scopes=()
          if [[ "$RUN_NODE" == "true" ]]; then
            if [[ "$RUN_OPENCLAW" == "true" && "$PLATFORM" == "linux-amd64" ]]; then
              compile node_dependencies just prepare-node-test-dependencies true
              language_scopes+=(openclaw)
            else
              compile node_dependencies just prepare-node-test-dependencies false
              language_scopes+=(node)
            fi
          fi
          if [[ "$RUN_PYTHON" == "true" && ( "$PLATFORM" == "linux-amd64" || "$PLATFORM" == "macos-arm64" || "$PLATFORM" == "windows-amd64" ) ]]; then
            language_scopes+=(python-plugin)
          fi
          if [[ "$RUN_GO" == "true" ]]; then
            language_scopes+=(go)
          fi
          if (( ${#language_scopes[@]} > 0 )); then
            compile language_native just build-language-test-artifacts "${language_scopes[@]}"
          fi
          if [[ "$RUN_NODE" == "true" ]]; then
            if [[ "$node_dependencies" == "success" && "$language_native" == "success" ]]; then
              node=success
            else
              node=failure
            fi
            if [[ "$RUN_OPENCLAW" == "true" && "$PLATFORM" == "linux-amd64" ]]; then
              openclaw="$node"
            fi
          fi
          if [[ "$RUN_PYTHON" == "true" && ( "$PLATFORM" == "linux-amd64" || "$PLATFORM" == "macos-arm64" || "$PLATFORM" == "windows-amd64" ) ]]; then
            python_plugin="$language_native"
            [[ "$python_plugin" == "success" ]] || python=failure
          fi
          if [[ "$RUN_GO" == "true" ]]; then
            go="$language_native"
          fi

          # Resolve every enabled Rust test owner into one Cargo graph after the
          # normal language artifacts so test execution never triggers a build.
          native_scopes=()
          [[ "$RUN_RUST" != "true" ]] || native_scopes+=(rust)
          [[ "$RUN_PYTHON" != "true" ]] || native_scopes+=(python)
          [[ "$RUN_NODE" != "true" ]] || native_scopes+=(node)
          [[ "$RUN_GO" != "true" ]] || native_scopes+=(go)
          if (( ${#native_scopes[@]} > 0 )); then
            echo "NEMO_RELAY_RUST_TEST_SCOPES=${native_scopes[*]}" >> "$GITHUB_ENV"
            compile native just build-rust-tests "${native_scopes[@]}"
            if [[ "$native" == "success" ]]; then
              [[ "$RUN_RUST" != "true" ]] || rust=success
            else
              [[ "$RUN_RUST" != "true" ]] || rust=failure
              [[ "$RUN_PYTHON" != "true" ]] || python=failure
              [[ "$RUN_NODE" != "true" ]] || node=failure
              [[ "$RUN_GO" != "true" ]] || go=failure
            fi
          fi

          if [[ "$fixtures" != "success" ]]; then
            [[ "$RUN_RUST" != "true" ]] || rust=failure
            [[ "$RUN_PYTHON" != "true" ]] || python=failure
            [[ "$RUN_GO" != "true" ]] || go=failure
            failed=true
          fi
          {
            echo "rust=$rust"
            echo "python=$python"
            echo "node=$node"
            echo "openclaw=$openclaw"
            echo "go=$go"
          } >> "$GITHUB_OUTPUT"
          [[ "$failed" == "false" ]]

      - name: Run Rust tests with coverage
        id: rust-test
        if: ${{ always() && inputs.run_rust && steps.test-compile.outputs.rust == 'success' }}
        continue-on-error: true
        working-directory: ${{ env.NEMO_RELAY_CI_WORKSPACE }}
        run: |
          set -e
          args=(
            --set ci true
            --set skip_build true
            --set output_dir "${{ github.workspace }}"
          )
          if [ "${{ matrix.run_redis_tests }}" = "true" ]; then
            export NEMO_RELAY_RUN_REDIS_TESTS=1
          fi
          if [ "${{ matrix.run_s3_tests }}" = "true" ]; then
            export NEMO_RELAY_RUN_S3_TESTS=1
            export NEMO_RELAY_S3_TEST_BUCKET=nemo-relay-atif-ci
            export AWS_ACCESS_KEY_ID=nemo-relay
            export AWS_SECRET_ACCESS_KEY=nemo-relay
            export AWS_REGION=us-east-1
            export AWS_ENDPOINT_URL=http://127.0.0.1:9090
            export AWS_ALLOW_HTTP=true
            export AWS_VIRTUAL_HOSTED_STYLE_REQUEST=false
          fi
          just "${args[@]}" test-rust

      - name: Run Python tests with coverage
        id: python-test
        if: ${{ always() && (inputs.run_python || inputs.run_python_integration_langchain) && steps.test-compile.outputs.python == 'success' }}
        continue-on-error: true
        working-directory: ${{ env.NEMO_RELAY_CI_WORKSPACE }}
        run: just --set ci true --set skip_build true --set output_dir "${{ github.workspace }}" test-python

      - name: Run Python plugin end-to-end test
        id: python-plugin-test
        if: >-
          ${{
            always()
            && (inputs.run_python || inputs.run_python_integration_langchain)
            && steps.test-compile.outputs.python == 'success'
            && (matrix.platform == 'linux-amd64' || matrix.platform == 'macos-arm64' || matrix.platform == 'windows-amd64')
          }}
        continue-on-error: true
        working-directory: ${{ env.NEMO_RELAY_CI_WORKSPACE }}
        run: just --set skip_build true test-python-plugin-e2e

      - name: Run Python LangChain integration tests
        id: python-integration-test
        if: ${{ always() && inputs.run_python_integration_langchain && steps.test-compile.outputs.python == 'success' && matrix.platform != 'windows-arm64' }}
        continue-on-error: true
        working-directory: ${{ env.NEMO_RELAY_CI_WORKSPACE }}
        run: just --set ci true --set skip_build true --set output_dir "${{ github.workspace }}" test-python-langchain

      - name: Prune uv cache
        id: uv-prune
        if: ${{ always() && (inputs.run_python || inputs.run_python_integration_langchain) }}
        continue-on-error: true
        working-directory: ${{ env.NEMO_RELAY_CI_WORKSPACE }}
        run: uv cache prune --ci

      - name: Run Node tests with coverage
        id: node-test
        if: ${{ always() && (inputs.run_node || inputs.run_openclaw) && steps.test-compile.outputs.node == 'success' }}
        continue-on-error: true
        working-directory: ${{ env.NEMO_RELAY_CI_WORKSPACE }}
        run: just --set ci true --set skip_build true --set output_dir "${{ github.workspace }}" test-node

      - name: Run OpenClaw integration checks
        id: openclaw-test
        if: ${{ always() && inputs.run_openclaw && steps.test-compile.outputs.openclaw == 'success' && matrix.platform == 'linux-amd64' }}
        continue-on-error: true
        working-directory: ${{ env.NEMO_RELAY_CI_WORKSPACE }}
        run: just --set ci true --set skip_build true test-openclaw

      - name: Run Go tests with coverage
        id: go-test
        if: ${{ always() && inputs.run_go && steps.test-compile.outputs.go == 'success' }}
        continue-on-error: true
        working-directory: ${{ env.NEMO_RELAY_CI_WORKSPACE }}
        run: just --set ci true --set skip_build true --set output_dir "${{ github.workspace }}" test-go

      - name: Generate combined Rust coverage
        id: rust-coverage
        if: ${{ always() && steps.coverage-setup.outcome == 'success' }}
        continue-on-error: true
        working-directory: ${{ env.NEMO_RELAY_CI_WORKSPACE }}
        run: >-
          cargo llvm-cov report
          --ignore-filename-regex '.*/tests/.*\.rs$'
          --cobertura
          --output-path "${{ github.workspace }}/rust-workspace.xml"

      - name: Collect coverage reports
        id: coverage-files
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          RUST_COVERAGE: ${{ steps.rust-coverage.outcome }}
          PYTHON_TEST: ${{ steps.python-test.outcome }}
          NODE_TEST: ${{ steps.node-test.outcome }}
          GO_TEST: ${{ steps.go-test.outcome }}
        run: |
          set -euo pipefail
          files=()
          add_report() {
            local report="$1"
            if [[ ! -f "$report" ]]; then
              echo "Error: expected coverage report not found: $report" >&2
              exit 1
            fi
            files+=("$report")
          }

          if [[ "$RUST_COVERAGE" == "success" ]]; then
            add_report rust-workspace.xml
          fi
          if [[ "$PYTHON_TEST" == "success" ]]; then
            add_report python-coverage.xml
          fi
          if [[ "$NODE_TEST" == "success" && "$PLATFORM" != windows-* ]]; then
            add_report node-coverage.xml
          fi
          if [[ "$GO_TEST" == "success" ]]; then
            add_report go-coverage.xml
          fi

          if (( ${#files[@]} == 0 )); then
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf -v file_list '%s,' "${files[@]}"
          echo "files=${file_list%,}" >> "$GITHUB_OUTPUT"
          echo "has_files=true" >> "$GITHUB_OUTPUT"

      - name: Upload coverage to Codecov
        id: coverage
        if: ${{ always() && steps.coverage-files.outcome == 'success' && steps.coverage-files.outputs.has_files == 'true' }}
        continue-on-error: true
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          files: ${{ steps.coverage-files.outputs.files }}
          flags: platform-${{ matrix.platform }}
          name: platform-${{ matrix.platform }}
          verbose: true

      - name: Report test results
        if: ${{ always() && !cancelled() }}
        env:
          HOMEBREW_CLEANUP: ${{ steps.homebrew-cleanup.outcome }}
          CHECKOUT: ${{ steps.checkout.outcome }}
          CI_CONFIG: ${{ steps.ci-config.outcome }}
          RUST_SETUP: ${{ steps.rust-setup.outcome }}
          RUST_CACHE: ${{ steps.rust-cache.outcome }}
          UV_SETUP: ${{ steps.uv-setup.outcome }}
          PYTHON_SETUP: ${{ steps.python-setup.outcome }}
          NODE_SETUP: ${{ steps.node-setup.outcome }}
          GO_SETUP: ${{ steps.go-setup.outcome }}
          TOOLS_SETUP: ${{ steps.tools-setup.outcome }}
          COVERAGE_SETUP: ${{ steps.coverage-setup.outcome }}
          TEST_COMPILE: ${{ steps.test-compile.outcome }}
          RUST_COMPILE: ${{ steps.test-compile.outputs.rust }}
          PYTHON_COMPILE: ${{ steps.test-compile.outputs.python }}
          NODE_COMPILE: ${{ steps.test-compile.outputs.node }}
          OPENCLAW_COMPILE: ${{ steps.test-compile.outputs.openclaw }}
          GO_COMPILE: ${{ steps.test-compile.outputs.go }}
          RUN_RUST: ${{ inputs.run_rust }}
          RUST_TEST: ${{ steps.rust-test.outcome }}
          RUN_PYTHON: ${{ inputs.run_python || inputs.run_python_integration_langchain }}
          RUN_PYTHON_INTEGRATION: ${{ inputs.run_python_integration_langchain }}
          PYTHON_TEST: ${{ steps.python-test.outcome }}
          PYTHON_PLUGIN_TEST: ${{ steps.python-plugin-test.outcome }}
          PYTHON_INTEGRATION_TEST: ${{ steps.python-integration-test.outcome }}
          UV_PRUNE: ${{ steps.uv-prune.outcome }}
          RUN_NODE: ${{ inputs.run_node || inputs.run_openclaw }}
          RUN_OPENCLAW: ${{ inputs.run_openclaw }}
          NODE_TEST: ${{ steps.node-test.outcome }}
          OPENCLAW_TEST: ${{ steps.openclaw-test.outcome }}
          RUN_GO: ${{ inputs.run_go }}
          GO_TEST: ${{ steps.go-test.outcome }}
          RUST_COVERAGE: ${{ steps.rust-coverage.outcome }}
          COVERAGE_FILES: ${{ steps.coverage-files.outcome }}
          HAS_COVERAGE_FILES: ${{ steps.coverage-files.outputs.has_files }}
          COVERAGE: ${{ steps.coverage.outcome }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          failed=false
          {
            printf '### Test results (%s)\n\n' "$PLATFORM"
            printf '| Operation | Result |\n|---|---|\n'
          } >> "$GITHUB_STEP_SUMMARY"

          report() {
            local enabled="$1"
            local name="$2"
            local result="${3:-skipped}"
            local expected="$4"
            if [[ "$enabled" != "true" ]]; then
              return
            fi
            printf '| %s | %s |\n' "$name" "${result:-skipped}" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$result" != "$expected" ]]; then
              echo "Error: ${name} finished with result '${result:-skipped}', expected ${expected}" >&2
              failed=true
            fi
          }

          report true "Checkout" "$CHECKOUT" success
          if [[ "$PLATFORM" == "macos-arm64" ]]; then
            report true "Homebrew cleanup" "$HOMEBREW_CLEANUP" success
          fi
          report true "CI configuration" "$CI_CONFIG" success
          report true "Rust setup" "$RUST_SETUP" success
          report true "Rust cache" "$RUST_CACHE" success
          report true "Test tools" "$TOOLS_SETUP" success
          if [[ "$PLATFORM" == "windows-arm64" ]]; then
            report true "Combined Rust coverage setup" "$COVERAGE_SETUP" skipped
          else
            report true "Combined Rust coverage setup" "$COVERAGE_SETUP" success
          fi
          report true "Compile test artifacts" "$TEST_COMPILE" success
          if [[ "$RUN_RUST" == "true" || "$RUN_PYTHON" == "true" ]]; then
            report true "uv setup" "$UV_SETUP" success
            report true "Python setup" "$PYTHON_SETUP" success
          fi
          report "$RUN_NODE" "Node.js setup" "$NODE_SETUP" success
          report "$RUN_GO" "Go setup" "$GO_SETUP" success
          report "$RUN_RUST" "Rust compilation" "$RUST_COMPILE" success
          report "$RUN_PYTHON" "Python compilation" "$PYTHON_COMPILE" success
          report "$RUN_NODE" "Node.js compilation" "$NODE_COMPILE" success
          if [[ "$PLATFORM" == "linux-amd64" ]]; then
            report "$RUN_OPENCLAW" "OpenClaw compilation" "$OPENCLAW_COMPILE" success
          else
            report "$RUN_OPENCLAW" "OpenClaw compilation" "$OPENCLAW_COMPILE" skipped
          fi
          report "$RUN_GO" "Go compilation" "$GO_COMPILE" success
          report "$RUN_RUST" "Rust tests" "$RUST_TEST" success
          report "$RUN_PYTHON" "Python tests" "$PYTHON_TEST" success
          if [[ "$PLATFORM" == "linux-amd64" || "$PLATFORM" == "macos-arm64" || "$PLATFORM" == "windows-amd64" ]]; then
            report "$RUN_PYTHON" "Python plugin end-to-end test" "$PYTHON_PLUGIN_TEST" success
          fi
          if [[ "$PLATFORM" != "windows-arm64" ]]; then
            report "$RUN_PYTHON_INTEGRATION" "Python integration tests" "$PYTHON_INTEGRATION_TEST" success
          fi
          report "$RUN_PYTHON" "uv cache prune" "$UV_PRUNE" success
          report "$RUN_NODE" "Node.js tests" "$NODE_TEST" success
          if [[ "$PLATFORM" == "linux-amd64" ]]; then
            report "$RUN_OPENCLAW" "OpenClaw tests" "$OPENCLAW_TEST" success
          fi
          report "$RUN_GO" "Go tests" "$GO_TEST" success
          if [[ "$PLATFORM" == "windows-arm64" ]]; then
            report true "Combined Rust coverage report" "$RUST_COVERAGE" skipped
          else
            report true "Combined Rust coverage report" "$RUST_COVERAGE" success
          fi
          report true "Collect coverage reports" "$COVERAGE_FILES" success
          report "$HAS_COVERAGE_FILES" "Codecov upload" "$COVERAGE" success

          if [[ "$failed" == "true" ]]; then
            exit 1
          fi

  PackageSmoke:
    name: Package smoke (${{ matrix.platform }})
    needs: [Package]
    if: >-
      ${{
        !cancelled()
        && needs.Package.result == 'success'
        && (inputs.run_rust_package || inputs.run_python_package || inputs.run_node_package)
      }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-latest
            rust_runtime_image: quay.io/pypa/manylinux2014_x86_64@sha256:35baef377f64c2ae2e7ed647917ecd090c50f6e8b06fd605012661c2e954cc92
            node_container_image: ''
            node_package_name: nemo-relay-node-linux-x64-gnu
            python_container_image: ''
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            rust_runtime_image: quay.io/pypa/manylinux2014_aarch64@sha256:63f73ecd2be3ad7cf66a402c72c1594b3f9140e263ab6838896e93a8fbf53794
            node_container_image: ''
            node_package_name: nemo-relay-node-linux-arm64-gnu
            python_container_image: ''
          - platform: linux-musl-amd64
            runner: ubuntu-latest
            rust_runtime_image: quay.io/pypa/musllinux_1_2_x86_64@sha256:7b54360b191356838f6e41d4b9820c69be4f3d8dc8e7bca26f2684d48e5c8633
            node_container_image: node:24-alpine3.22@sha256:191c9f0080fcbbc6547a85dc0ff7988072214a355aabdc1d2ec55a7dae5eea8a
            node_package_name: nemo-relay-node-linux-x64-musl
            python_container_image: quay.io/pypa/musllinux_1_2_x86_64@sha256:7b54360b191356838f6e41d4b9820c69be4f3d8dc8e7bca26f2684d48e5c8633
          - platform: linux-musl-arm64
            runner: ubuntu-24.04-arm
            rust_runtime_image: quay.io/pypa/musllinux_1_2_aarch64@sha256:274a947b4d5d745b56b868b0d052641e0798a652e3e65755987edf60547d1268
            node_container_image: node:24-alpine3.22@sha256:191c9f0080fcbbc6547a85dc0ff7988072214a355aabdc1d2ec55a7dae5eea8a
            node_package_name: nemo-relay-node-linux-arm64-musl
            python_container_image: quay.io/pypa/musllinux_1_2_aarch64@sha256:274a947b4d5d745b56b868b0d052641e0798a652e3e65755987edf60547d1268
          - platform: macos-arm64
            runner: macos-15
            rust_runtime_image: ''
            node_container_image: ''
            node_package_name: nemo-relay-node-darwin-arm64
            python_container_image: ''
          - platform: windows-amd64
            runner: windows-2022
            rust_runtime_image: ''
            node_container_image: ''
            node_package_name: nemo-relay-node-win32-x64-msvc
            python_container_image: ''
          - platform: windows-arm64
            runner: windows-11-arm
            rust_runtime_image: ''
            node_container_image: ''
            node_package_name: nemo-relay-node-win32-arm64-msvc
            python_container_image: ''
          - platform: source-and-plugin
            runner: ubuntu-latest
            rust_runtime_image: ''
            node_container_image: ''
            node_package_name: ''
            python_container_image: ''

    steps:
      - name: Remove untrusted Homebrew tap
        id: homebrew-cleanup
        if: ${{ runner.os == 'macOS' }}
        continue-on-error: true
        run: |
          if [ -d "$(brew --repository aws/tap)" ]; then
            brew untap aws/tap
          fi

      - name: Checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Load CI tool versions
        id: ci-config
        if: ${{ always() }}
        continue-on-error: true
        uses: ./.github/actions/load-ci-tool-versions

      - name: Set up Rust for Python source smoke test
        id: rust-setup
        if: ${{ always() && inputs.run_python_package && matrix.platform == 'source-and-plugin' }}
        continue-on-error: true
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1.15.4
        with:
          cache: false
          toolchain: ${{ steps.ci-config.outputs.rust_version }}

      - name: Restore Rust source-package cache
        id: rust-cache
        if: ${{ always() && inputs.run_python_package && matrix.platform == 'source-and-plugin' }}
        continue-on-error: true
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: nemo-relay-rust-linux-amd64-${{ steps.ci-config.outputs.rust_version }}-release
          workspaces: . -> target
          cache-all-crates: true
          cache-bin: false
          save-if: false

      - name: Set up uv
        id: uv-setup
        if: ${{ always() && !contains(matrix.platform, 'musl') && (inputs.run_rust_package || inputs.run_python_package) }}
        continue-on-error: true
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8
        with:
          version: ${{ steps.ci-config.outputs.uv_version }}

      - name: Set up Python
        id: python-setup
        if: ${{ always() && !contains(matrix.platform, 'musl') && (inputs.run_rust_package || inputs.run_python_package) }}
        continue-on-error: true
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.ci-config.outputs.default_python_version }}

      - name: Set up Node.js
        id: node-setup
        if: ${{ always() && inputs.run_node_package && !contains(matrix.platform, 'musl') && matrix.platform != 'source-and-plugin' }}
        continue-on-error: true
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: ${{ steps.ci-config.outputs.node_version }}

      - name: Download matching Python wheel artifact
        id: python-download
        if: ${{ always() && inputs.run_python_package && !contains(matrix.platform, 'musl') && matrix.platform != 'source-and-plugin' }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-${{ matrix.platform }}
          path: python-wheel/

      - name: Install and import Python wheel
        id: python-smoke
        if: ${{ always() && inputs.run_python_package && steps.python-download.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          wheel="$(find python-wheel -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv venv --python "$(uv python find)" "${RUNNER_TEMP}/nemo-relay-wheel-venv"
          if [ "${{ runner.os }}" = "Windows" ]; then
            venv_python="${RUNNER_TEMP}/nemo-relay-wheel-venv/Scripts/python.exe"
          else
            venv_python="${RUNNER_TEMP}/nemo-relay-wheel-venv/bin/python"
          fi
          uv pip install --python "$venv_python" --no-deps "$wheel"
          "$venv_python" -c "import nemo_relay"

      - name: Download matching musllinux Python wheel artifact
        id: python-musl-download
        if: ${{ always() && inputs.run_python_package && contains(matrix.platform, 'musl') }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-${{ matrix.platform }}
          path: python-wheel/

      - name: Install and import musllinux Python wheel
        id: python-musl-smoke
        if: ${{ always() && inputs.run_python_package && steps.python-musl-download.outcome == 'success' }}
        continue-on-error: true
        env:
          MUSLLINUX_IMAGE: ${{ matrix.python_container_image }}
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "${{ github.workspace }}:${{ github.workspace }}" \
            --workdir "${{ github.workspace }}" \
            "$MUSLLINUX_IMAGE" \
            /bin/sh -ec '
              wheel="$(find python-wheel -maxdepth 1 -name "*.whl" -print -quit)"
              test -n "$wheel"
              /opt/python/cp311-cp311/bin/python -m venv /tmp/nemo-relay-wheel-venv
              /tmp/nemo-relay-wheel-venv/bin/python -m pip install --no-deps "$wheel"
              /tmp/nemo-relay-wheel-venv/bin/python -c "import nemo_relay"
            '

      - name: Download Python source distribution artifact
        id: python-sdist-download
        if: ${{ always() && inputs.run_python_package && matrix.platform == 'source-and-plugin' }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-sdist
          path: python-sdist/

      - name: Download Python plugin SDK wheel artifact
        id: python-plugin-download
        if: ${{ always() && inputs.run_python_package && matrix.platform == 'source-and-plugin' }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin-wheel
          path: plugin-wheel/

      - name: Build, install, and import Python source distribution
        id: python-sdist-smoke
        if: ${{ always() && inputs.run_python_package && steps.python-sdist-download.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          sdist="$(find python-sdist -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -n "$sdist"
          uv venv --python "$(uv python find)" "${RUNNER_TEMP}/nemo-relay-sdist-venv"
          uv pip install \
            --python "${RUNNER_TEMP}/nemo-relay-sdist-venv/bin/python" \
            --no-deps \
            "$sdist"
          "${RUNNER_TEMP}/nemo-relay-sdist-venv/bin/python" -c "import nemo_relay"

      - name: Install and import Python plugin SDK wheel
        id: python-plugin-smoke
        if: ${{ always() && inputs.run_python_package && steps.python-plugin-download.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          wheel="$(find plugin-wheel -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv venv --python "$(uv python find)" "${RUNNER_TEMP}/nemo-relay-plugin-venv"
          uv pip install \
            --python "${RUNNER_TEMP}/nemo-relay-plugin-venv/bin/python" \
            "$wheel"
          "${RUNNER_TEMP}/nemo-relay-plugin-venv/bin/python" -c \
            "import nemo_relay_plugin._proto.plugin_worker_pb2_grpc"

      - name: Download Node metapackage artifact
        id: node-metapackage-download
        if: ${{ always() && inputs.run_node_package && matrix.platform != 'source-and-plugin' }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: node-npm-package-linux-amd64
          path: node-metapackage/

      - name: Download matching Node native package artifact
        id: node-native-download
        if: ${{ always() && inputs.run_node_package && matrix.platform != 'source-and-plugin' }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: node-npm-package-${{ matrix.platform }}
          path: node-native/

      - name: Install and load split Node package
        id: node-smoke
        if: >-
          ${{
            always()
            && inputs.run_node_package
            && !contains(matrix.platform, 'musl')
            && matrix.platform != 'source-and-plugin'
            && steps.node-metapackage-download.outcome == 'success'
            && steps.node-native-download.outcome == 'success'
          }}
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir package-smoke
          cd package-smoke
          npm init --yes >/dev/null
          metapackage=(../node-metapackage/nemo-relay-node-npm-[0-9]*.tgz)
          native=(../node-native/nemo-relay-node-npm-*-*-[0-9]*.tgz)
          npm install --ignore-scripts "${native[0]}" "${metapackage[0]}"
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const { readdirSync } = require('node:fs');
          const nativePackages = readdirSync('node_modules').filter(
            (name) => name.startsWith('nemo-relay-node-') && name !== 'nemo-relay-node',
          );
          assert.equal(nativePackages.length, 1);
          for (const entrypoint of [
            'nemo-relay-node',
            'nemo-relay-node/typed',
            'nemo-relay-node/plugin',
            'nemo-relay-node/adaptive',
            'nemo-relay-node/observability',
            'nemo-relay-node/pii_redaction',
            'nemo-relay-node/model_pricing',
          ]) {
            require(entrypoint);
          }
          NODE

      - name: Install and load musllinux split Node package
        id: node-musl-smoke
        if: >-
          ${{
            always()
            && inputs.run_node_package
            && contains(matrix.platform, 'musl')
            && steps.node-metapackage-download.outcome == 'success'
            && steps.node-native-download.outcome == 'success'
          }}
        continue-on-error: true
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "${{ github.workspace }}:${{ github.workspace }}" \
            --workdir "${{ github.workspace }}" \
            --env NEMO_RELAY_NODE_PACKAGE_NAME="${{ matrix.node_package_name }}" \
            --env NEMO_RELAY_WORKSPACE="${{ github.workspace }}" \
            "${{ matrix.node_container_image }}" \
            sh -ceu '
              smoke_dir="$(mktemp -d)"
              trap "rm -rf $smoke_dir" EXIT
              cd "$smoke_dir"
              npm init --yes >/dev/null
              metapackage="$(find "$NEMO_RELAY_WORKSPACE/node-metapackage" -name "nemo-relay-node-npm-[0-9]*.tgz" -print -quit)"
              native_count="$(find "$NEMO_RELAY_WORKSPACE/node-native" -name "nemo-relay-node-npm-*-*-[0-9]*.tgz" | wc -l)"
              test "$native_count" -eq 1
              native="$(find "$NEMO_RELAY_WORKSPACE/node-native" -name "nemo-relay-node-npm-*-*-[0-9]*.tgz" -print -quit)"
              test -n "$metapackage"
              test -n "$native"
              npm install --ignore-scripts "$native" "$metapackage"
              node -e "
                const assert = require(\"node:assert/strict\");
                const { readdirSync } = require(\"node:fs\");
                const manifest = require(process.env.NEMO_RELAY_NODE_PACKAGE_NAME + \"/package.json\");
                const nativePackages = readdirSync(\"node_modules\").filter(
                  (name) => name.startsWith(\"nemo-relay-node-\") && name !== \"nemo-relay-node\",
                );
                assert.equal(nativePackages.length, 1);
                assert.deepEqual(manifest.libc, [\"musl\"]);
                for (const entrypoint of [
                  \"nemo-relay-node\",
                  \"nemo-relay-node/typed\",
                  \"nemo-relay-node/plugin\",
                  \"nemo-relay-node/adaptive\",
                  \"nemo-relay-node/observability\",
                  \"nemo-relay-node/pii_redaction\",
                  \"nemo-relay-node/model_pricing\",
                ]) {
                  require(entrypoint);
                }
              "
            '

      - name: Download matching Rust CLI binary artifact
        id: rust-binary-download
        if: ${{ always() && inputs.run_rust_package && matrix.platform != 'source-and-plugin' }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-binary-${{ matrix.platform }}
          path: cli-binary/

      - name: Download matching Rust CLI wheel artifact
        id: rust-wheel-download
        if: ${{ always() && inputs.run_rust_package && matrix.platform != 'source-and-plugin' }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-python-wheel-${{ matrix.platform }}
          path: cli-wheel/

      - name: Run downloaded Rust CLI binary and wheel
        id: rust-smoke
        if: >-
          ${{
            always()
            && inputs.run_rust_package
            && matrix.platform != 'source-and-plugin'
            && matrix.rust_runtime_image == ''
            && steps.rust-binary-download.outcome == 'success'
            && steps.rust-wheel-download.outcome == 'success'
          }}
        continue-on-error: true
        run: |
          set -euo pipefail
          binary="$(find cli-binary -maxdepth 1 -type f -print -quit)"
          wheel="$(find cli-wheel -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$binary"
          test -n "$wheel"
          chmod +x "$binary"
          binary_version="$("$binary" --version)"
          uv venv --python "$(uv python find)" "${RUNNER_TEMP}/nemo-relay-cli-venv"
          if [ "${{ runner.os }}" = "Windows" ]; then
            venv_python="${RUNNER_TEMP}/nemo-relay-cli-venv/Scripts/python.exe"
            venv_cli="${RUNNER_TEMP}/nemo-relay-cli-venv/Scripts/nemo-relay.exe"
          else
            venv_python="${RUNNER_TEMP}/nemo-relay-cli-venv/bin/python"
            venv_cli="${RUNNER_TEMP}/nemo-relay-cli-venv/bin/nemo-relay"
          fi
          uv pip install --python "$venv_python" --no-deps "$wheel"
          wheel_version="$("$venv_cli" --version)"
          if [ "$binary_version" != "$wheel_version" ]; then
            echo "Error: CLI binary reports '$binary_version' but wheel reports '$wheel_version'" >&2
            exit 1
          fi

      - name: Run downloaded Rust CLI binary and wheel in Linux runtime container
        id: rust-container-smoke
        if: >-
          ${{
            always()
            && inputs.run_rust_package
            && matrix.platform != 'source-and-plugin'
            && matrix.rust_runtime_image != ''
            && steps.rust-binary-download.outcome == 'success'
            && steps.rust-wheel-download.outcome == 'success'
          }}
        continue-on-error: true
        env:
          RUNTIME_IMAGE: ${{ matrix.rust_runtime_image }}
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "${{ github.workspace }}:${{ github.workspace }}" \
            --workdir "${{ github.workspace }}" \
            "$RUNTIME_IMAGE" \
            /bin/sh -ec '
              binary="$(find cli-binary -maxdepth 1 -type f -print -quit)"
              wheel="$(find cli-wheel -maxdepth 1 -name "*.whl" -print -quit)"
              test -n "$binary"
              test -n "$wheel"
              chmod +x "$binary"
              binary_version="$("$binary" --version)"
              /opt/python/cp311-cp311/bin/python -m venv /tmp/nemo-relay-cli-venv
              /tmp/nemo-relay-cli-venv/bin/python -m pip install --no-deps "$wheel"
              wheel_version="$(/tmp/nemo-relay-cli-venv/bin/nemo-relay --version)"
              if [ "$binary_version" != "$wheel_version" ]; then
                echo "Error: CLI binary and wheel versions differ" >&2
                exit 1
              fi
            '

      - name: Report package smoke results
        if: ${{ always() && !cancelled() }}
        env:
          HOMEBREW_CLEANUP: ${{ steps.homebrew-cleanup.outcome }}
          CHECKOUT: ${{ steps.checkout.outcome }}
          CI_CONFIG: ${{ steps.ci-config.outcome }}
          RUST_SETUP: ${{ steps.rust-setup.outcome }}
          RUST_CACHE: ${{ steps.rust-cache.outcome }}
          UV_SETUP: ${{ steps.uv-setup.outcome }}
          PYTHON_SETUP: ${{ steps.python-setup.outcome }}
          NODE_SETUP: ${{ steps.node-setup.outcome }}
          RUN_PYTHON: ${{ inputs.run_python_package }}
          PYTHON_DOWNLOAD: ${{ steps.python-download.outcome }}
          PYTHON_SMOKE: ${{ steps.python-smoke.outcome }}
          PYTHON_MUSL_DOWNLOAD: ${{ steps.python-musl-download.outcome }}
          PYTHON_MUSL_SMOKE: ${{ steps.python-musl-smoke.outcome }}
          PYTHON_SDIST_DOWNLOAD: ${{ steps.python-sdist-download.outcome }}
          PYTHON_SDIST_SMOKE: ${{ steps.python-sdist-smoke.outcome }}
          PYTHON_PLUGIN_DOWNLOAD: ${{ steps.python-plugin-download.outcome }}
          PYTHON_PLUGIN_SMOKE: ${{ steps.python-plugin-smoke.outcome }}
          RUN_NODE: ${{ inputs.run_node_package }}
          NODE_METAPACKAGE_DOWNLOAD: ${{ steps.node-metapackage-download.outcome }}
          NODE_NATIVE_DOWNLOAD: ${{ steps.node-native-download.outcome }}
          NODE_SMOKE: ${{ steps.node-smoke.outcome }}
          NODE_MUSL_SMOKE: ${{ steps.node-musl-smoke.outcome }}
          RUN_RUST: ${{ inputs.run_rust_package }}
          RUST_BINARY_DOWNLOAD: ${{ steps.rust-binary-download.outcome }}
          RUST_WHEEL_DOWNLOAD: ${{ steps.rust-wheel-download.outcome }}
          RUST_SMOKE: ${{ steps.rust-smoke.outcome }}
          RUST_CONTAINER_SMOKE: ${{ steps.rust-container-smoke.outcome }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          failed=false
          {
            printf '### Package smoke results (%s)\n\n' "$PLATFORM"
            printf '| Operation | Result |\n|---|---|\n'
          } >> "$GITHUB_STEP_SUMMARY"

          report() {
            local enabled="$1"
            local name="$2"
            local result="${3:-skipped}"
            if [[ "$enabled" != "true" ]]; then
              return
            fi
            printf '| %s | %s |\n' "$name" "${result:-skipped}" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$result" != "success" ]]; then
              echo "Error: ${name} finished with result '${result:-skipped}', expected success" >&2
              failed=true
            fi
          }

          report true "Checkout" "$CHECKOUT"
          if [[ "$PLATFORM" == "macos-arm64" ]]; then
            report true "Homebrew cleanup" "$HOMEBREW_CLEANUP"
          fi
          report true "CI configuration" "$CI_CONFIG"
          if [[ "$PLATFORM" == "source-and-plugin" ]]; then
            report "$RUN_PYTHON" "Rust setup" "$RUST_SETUP"
            report "$RUN_PYTHON" "Rust cache" "$RUST_CACHE"
          fi
          if [[ "$PLATFORM" != *musl* ]]; then
            if [[ "$RUN_RUST" == "true" || "$RUN_PYTHON" == "true" ]]; then
              report true "uv setup" "$UV_SETUP"
              report true "Python setup" "$PYTHON_SETUP"
            fi
            if [[ "$PLATFORM" != "source-and-plugin" ]]; then
              report "$RUN_NODE" "Node.js setup" "$NODE_SETUP"
            fi
          fi
          if [[ "$PLATFORM" == "source-and-plugin" ]]; then
            report "$RUN_PYTHON" "Python source download" "$PYTHON_SDIST_DOWNLOAD"
            report "$RUN_PYTHON" "Python source distribution" "$PYTHON_SDIST_SMOKE"
            report "$RUN_PYTHON" "Python plugin download" "$PYTHON_PLUGIN_DOWNLOAD"
            report "$RUN_PYTHON" "Python plugin wheel" "$PYTHON_PLUGIN_SMOKE"
          elif [[ "$PLATFORM" == *musl* ]]; then
            report "$RUN_PYTHON" "Python musllinux download" "$PYTHON_MUSL_DOWNLOAD"
            report "$RUN_PYTHON" "Python musllinux wheel" "$PYTHON_MUSL_SMOKE"
            report "$RUN_NODE" "Node.js metapackage download" "$NODE_METAPACKAGE_DOWNLOAD"
            report "$RUN_NODE" "Node.js native package download" "$NODE_NATIVE_DOWNLOAD"
            report "$RUN_NODE" "Node.js musllinux package" "$NODE_MUSL_SMOKE"
            report "$RUN_RUST" "Rust CLI binary download" "$RUST_BINARY_DOWNLOAD"
            report "$RUN_RUST" "Rust CLI wheel download" "$RUST_WHEEL_DOWNLOAD"
            report "$RUN_RUST" "Rust CLI container" "$RUST_CONTAINER_SMOKE"
          else
            report "$RUN_PYTHON" "Python wheel download" "$PYTHON_DOWNLOAD"
            report "$RUN_PYTHON" "Python wheel" "$PYTHON_SMOKE"
            report "$RUN_NODE" "Node.js metapackage download" "$NODE_METAPACKAGE_DOWNLOAD"
            report "$RUN_NODE" "Node.js native package download" "$NODE_NATIVE_DOWNLOAD"
            report "$RUN_NODE" "Node.js package" "$NODE_SMOKE"
            report "$RUN_RUST" "Rust CLI binary download" "$RUST_BINARY_DOWNLOAD"
            report "$RUN_RUST" "Rust CLI wheel download" "$RUST_WHEEL_DOWNLOAD"
            if [[ -n "${RUST_CONTAINER_SMOKE:-}" && "$RUST_CONTAINER_SMOKE" != "skipped" ]]; then
              report "$RUN_RUST" "Rust CLI container" "$RUST_CONTAINER_SMOKE"
            else
              report "$RUN_RUST" "Rust CLI" "$RUST_SMOKE"
            fi
          fi

          if [[ "$failed" == "true" ]]; then
            exit 1
          fi

  Package:
    name: Package (${{ matrix.platform }})
    if: ${{ inputs.run_rust_package || inputs.run_python_package || inputs.run_node_package || inputs.run_openclaw }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            rust_build_image: quay.io/pypa/manylinux2014_x86_64@sha256:35baef377f64c2ae2e7ed647917ecd090c50f6e8b06fd605012661c2e954cc92
            rust_runtime_image: quay.io/pypa/manylinux2014_x86_64@sha256:35baef377f64c2ae2e7ed647917ecd090c50f6e8b06fd605012661c2e954cc92
            node_build_strategy: zig
            node_target: x86_64-unknown-linux-gnu
            node_container_image: ''
            node_package_name: nemo-relay-node-linux-x64-gnu
            python_architecture: ''
            python_rust_target: ''
            python_container_image: ''
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            rust_build_image: quay.io/pypa/manylinux2014_aarch64@sha256:63f73ecd2be3ad7cf66a402c72c1594b3f9140e263ab6838896e93a8fbf53794
            rust_runtime_image: quay.io/pypa/manylinux2014_aarch64@sha256:63f73ecd2be3ad7cf66a402c72c1594b3f9140e263ab6838896e93a8fbf53794
            node_build_strategy: zig
            node_target: aarch64-unknown-linux-gnu
            node_container_image: ''
            node_package_name: nemo-relay-node-linux-arm64-gnu
            python_architecture: ''
            python_rust_target: ''
            python_container_image: ''
          - platform: linux-musl-amd64
            runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-musl
            rust_build_image: ''
            rust_runtime_image: quay.io/pypa/musllinux_1_2_x86_64@sha256:7b54360b191356838f6e41d4b9820c69be4f3d8dc8e7bca26f2684d48e5c8633
            node_build_strategy: zig
            node_target: x86_64-unknown-linux-musl
            node_container_image: node:24-alpine3.22@sha256:191c9f0080fcbbc6547a85dc0ff7988072214a355aabdc1d2ec55a7dae5eea8a
            node_package_name: nemo-relay-node-linux-x64-musl
            python_architecture: x86_64
            python_rust_target: x86_64-unknown-linux-musl
            python_container_image: quay.io/pypa/musllinux_1_2_x86_64@sha256:7b54360b191356838f6e41d4b9820c69be4f3d8dc8e7bca26f2684d48e5c8633
          - platform: linux-musl-arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
            rust_build_image: ''
            rust_runtime_image: quay.io/pypa/musllinux_1_2_aarch64@sha256:274a947b4d5d745b56b868b0d052641e0798a652e3e65755987edf60547d1268
            node_build_strategy: zig
            node_target: aarch64-unknown-linux-musl
            node_container_image: node:24-alpine3.22@sha256:191c9f0080fcbbc6547a85dc0ff7988072214a355aabdc1d2ec55a7dae5eea8a
            node_package_name: nemo-relay-node-linux-arm64-musl
            python_architecture: aarch64
            python_rust_target: aarch64-unknown-linux-musl
            python_container_image: quay.io/pypa/musllinux_1_2_aarch64@sha256:274a947b4d5d745b56b868b0d052641e0798a652e3e65755987edf60547d1268
          - platform: macos-arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
            rust_build_image: ''
            rust_runtime_image: ''
            node_build_strategy: native
            node_target: ''
            node_container_image: ''
            node_package_name: nemo-relay-node-darwin-arm64
            python_architecture: ''
            python_rust_target: ''
            python_container_image: ''
          - platform: windows-amd64
            runner: windows-2022
            rust_target: x86_64-pc-windows-msvc
            rust_build_image: ''
            rust_runtime_image: ''
            node_build_strategy: native
            node_target: ''
            node_container_image: ''
            node_package_name: nemo-relay-node-win32-x64-msvc
            python_architecture: ''
            python_rust_target: ''
            python_container_image: ''
          - platform: windows-arm64
            runner: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            rust_build_image: ''
            rust_runtime_image: ''
            node_build_strategy: native
            node_target: ''
            node_container_image: ''
            node_package_name: nemo-relay-node-win32-arm64-msvc
            python_architecture: ''
            python_rust_target: ''
            python_container_image: ''

    steps:
      - name: Remove untrusted Homebrew tap
        id: homebrew-cleanup
        if: ${{ runner.os == 'macOS' }}
        continue-on-error: true
        run: |
          if [ -d "$(brew --repository aws/tap)" ]; then
            brew untap aws/tap
          fi

      - name: Checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Load CI tool versions
        id: ci-config
        if: ${{ always() }}
        continue-on-error: true
        uses: ./.github/actions/load-ci-tool-versions

      - name: Set up Rust
        id: rust-setup
        if: ${{ always() }}
        continue-on-error: true
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1.15.4
        with:
          cache: false
          toolchain: ${{ steps.ci-config.outputs.rust_version }}

      - name: Restore Rust package cache
        id: rust-cache
        if: ${{ always() }}
        continue-on-error: true
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: nemo-relay-rust-${{ matrix.platform }}-${{ steps.ci-config.outputs.rust_version }}-release
          workspaces: . -> target
          cache-all-crates: true
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up uv
        id: uv-setup
        if: ${{ always() }}
        continue-on-error: true
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8
        with:
          version: ${{ steps.ci-config.outputs.uv_version }}
          enable-cache: true
          cache-dependency-glob: ${{ env.NEMO_RELAY_CI_WORKSPACE }}/uv.lock

      - name: Set up Python
        id: python-setup
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.ci-config.outputs.default_python_version }}

      - name: Set up Node.js
        id: node-setup
        if: ${{ always() && (inputs.run_node_package || inputs.run_openclaw) }}
        continue-on-error: true
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: ${{ steps.ci-config.outputs.node_version }}

      - name: Install packaging tools
        id: tools-setup
        if: ${{ always() }}
        continue-on-error: true
        uses: taiki-e/install-action@c070f87102a1c75b3183910f391c1cb887fe13c8 # v2.77.6
        with:
          tool: just@${{ steps.ci-config.outputs.just_version }}

      - name: Derive package version
        id: package-version
        continue-on-error: true
        working-directory: ${{ env.NEMO_RELAY_CI_WORKSPACE }}
        env:
          REF_NAME: ${{ inputs.ref_name }}
          REF_TYPE: ${{ inputs.ref_type }}
        run: |
          set -euo pipefail
          version="$REF_NAME"
          if [[ "$REF_TYPE" != "tag" ]]; then
            version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)+${GIT_COMMIT::8}"
          fi
          if [[ -z "$version" ]]; then
            echo "Error: failed to derive package version" >&2
            exit 1
          fi
          printf 'NEMO_RELAY_PACKAGE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"

      - name: Derive Maturin version
        id: maturin-version
        if: ${{ always() && steps.package-version.outcome == 'success' && inputs.run_python_package && contains(matrix.platform, 'musl') }}
        continue-on-error: true
        run: |
          set -euo pipefail
          maturin_version="$(awk '
            $0 == "name = \"maturin\"" { found = 1; next }
            found && /^version = / {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' uv.lock)"
          if [[ -z "$maturin_version" ]]; then
            echo "Error: failed to read maturin version from uv.lock" >&2
            exit 1
          fi
          printf 'NEMO_RELAY_MATURIN_VERSION=%s\n' "$maturin_version" >> "$GITHUB_ENV"

      - name: Install Node Rust target
        id: node-target
        if: ${{ always() && steps.package-version.outcome == 'success' && inputs.run_node_package && startsWith(matrix.platform, 'linux-') }}
        continue-on-error: true
        run: rustup target add ${{ matrix.node_target }}

      - name: Install Rust musl tools
        id: rust-musl-tools
        if: ${{ always() && steps.package-version.outcome == 'success' && inputs.run_rust_package && contains(matrix.platform, 'musl') }}
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ "${{ runner.arch }}" = "ARM64" ]; then
            for sources in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
              if [ -f "$sources" ]; then
                sudo sed -i 's|http://ports.ubuntu.com/ubuntu-ports|https://ports.ubuntu.com/ubuntu-ports|g' "$sources"
              fi
            done
          fi
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y musl-tools
          rustup target add "${{ matrix.rust_target }}"

      - name: Compile package artifacts
        id: package-compile
        if: ${{ always() && steps.package-version.outcome == 'success' }}
        continue-on-error: true
        uses: ./.github/actions/compile-packages
        with:
          platform: ${{ matrix.platform }}
          rust-target: ${{ matrix.rust_target }}
          rust-build-image: ${{ matrix.rust_build_image }}
          rust-version: ${{ steps.ci-config.outputs.rust_version }}
          node-target: ${{ matrix.node_target }}
          node-build-strategy: ${{ matrix.node_build_strategy }}
          python-rust-target: ${{ matrix.python_rust_target }}
          python-container-image: ${{ matrix.python_container_image }}
          maturin-version: ${{ env.NEMO_RELAY_MATURIN_VERSION }}
          package-version: ${{ env.NEMO_RELAY_PACKAGE_VERSION }}
          workspace: ${{ env.NEMO_RELAY_CI_WORKSPACE }}
          workspace-tmp: ${{ env.NEMO_RELAY_CI_WORKSPACE_TMP }}
          run-python: ${{ inputs.run_python_package }}
          run-node: ${{ inputs.run_node_package }}
          run-openclaw: ${{ inputs.run_openclaw && matrix.platform == 'linux-amd64' }}
          run-rust: ${{ inputs.run_rust_package }}

      - name: Upload Python wheel artifact
        id: python-upload
        if: ${{ always() && steps.package-version.outcome == 'success' && inputs.run_python_package && !contains(matrix.platform, 'musl') && steps.package-compile.outputs.python == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wheel-${{ matrix.platform }}
          path: ${{ env.NEMO_RELAY_CI_WORKSPACE_TMP }}/wheels/*.whl
          if-no-files-found: error

      - name: Package Python source distribution
        id: python-sdist-package
        if: ${{ always() && steps.package-version.outcome == 'success' && inputs.run_python_package && matrix.platform == 'linux-amd64' }}
        continue-on-error: true
        working-directory: ${{ env.NEMO_RELAY_CI_WORKSPACE }}
        run: |
          set -e
          just \
            --set output_dir "${{ env.NEMO_RELAY_CI_WORKSPACE_TMP }}" \
            --set ref_name "${NEMO_RELAY_PACKAGE_VERSION}" \
            package-python-sdist

      - name: Upload Python source distribution artifact
        id: python-sdist-upload
        if: ${{ always() && steps.package-version.outcome == 'success' && inputs.run_python_package && matrix.platform == 'linux-amd64' && steps.python-sdist-package.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: python-sdist
          path: ${{ env.NEMO_RELAY_CI_WORKSPACE_TMP }}/sdists/nemo_relay-*.tar.gz
          if-no-files-found: error

      - name: Package Python plugin SDK wheel
        id: python-plugin-package
        if: ${{ always() && steps.package-version.outcome == 'success' && inputs.run_python_package && matrix.platform == 'linux-amd64' }}
        continue-on-error: true
        working-directory: ${{ env.NEMO_RELAY_CI_WORKSPACE }}
        run: |
          set -e
          just \
            --set output_dir "${{ env.NEMO_RELAY_CI_WORKSPACE_TMP }}" \
            --set ref_name "${NEMO_RELAY_PACKAGE_VERSION}" \
            package-python-plugin

      - name: Upload Python plugin SDK wheel artifact
        id: python-plugin-upload
        if: ${{ always() && steps.package-version.outcome == 'success' && inputs.run_python_package && matrix.platform == 'linux-amd64' && steps.python-plugin-package.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: plugin-wheel
          path: ${{ env.NEMO_RELAY_CI_WORKSPACE_TMP }}/plugin-wheels/*.whl
          if-no-files-found: error

      - name: Verify musllinux Python wheel platform tag
        id: python-musl-verify
        if: ${{ always() && steps.package-version.outcome == 'success' && inputs.run_python_package && contains(matrix.platform, 'musl') && steps.package-compile.outputs.python == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=("${{ env.NEMO_RELAY_CI_WORKSPACE_TMP }}/musllinux-wheels"/*-cp311-abi3-musllinux_1_2_${{ matrix.python_architecture }}.whl)
          if [[ "${#wheels[@]}" -ne 1 ]]; then
            echo "Error: expected one cp311-abi3 musllinux wheel for ${{ matrix.python_architecture }}, found ${#wheels[@]}" >&2
            exit 1
          fi

      - name: Upload musllinux Python wheel artifact
        id: python-musl-upload
        if: ${{ always() && steps.package-version.outcome == 'success' && inputs.run_python_package && contains(matrix.platform, 'musl') && steps.python-musl-verify.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wheel-${{ matrix.platform }}
          path: ${{ env.NEMO_RELAY_CI_WORKSPACE_TMP }}/musllinux-wheels/*.whl
          if-no-files-found: error

      - name: Prune uv cache
        id: uv-prune
        if: ${{ always() && inputs.run_python_package && !contains(matrix.platform, 'musl') }}
        continue-on-error: true
        working-directory: ${{ env.NEMO_RELAY_CI_WORKSPACE }}
        run: uv cache prune --ci

      - name: Upload split Node npm package artifacts
        id: node-upload
        if: ${{ always() && steps.package-version.outcome == 'success' && inputs.run_node_package && steps.package-compile.outputs.node == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: node-npm-package-${{ matrix.platform }}
          path: ${{ env.NEMO_RELAY_CI_WORKSPACE_TMP }}/npm/*.tgz
          if-no-files-found: error

      - name: Upload OpenClaw plugin artifact
        id: openclaw-upload
        if: ${{ always() && steps.package-version.outcome == 'success' && inputs.run_openclaw && matrix.platform == 'linux-amd64' && steps.package-compile.outputs.openclaw == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: openclaw-npm
          path: ${{ env.NEMO_RELAY_CI_WORKSPACE_TMP }}/openclaw/*.tgz
          if-no-files-found: error

      - name: Stage Rust CLI artifacts
        id: rust-stage
        if: >-
          ${{
            always()
            && steps.package-version.outcome == 'success'
            && inputs.run_rust_package
            && steps.package-compile.outputs.rust == 'success'
          }}
        continue-on-error: true
        working-directory: ${{ env.NEMO_RELAY_CI_WORKSPACE }}
        env:
          REF_NAME: ${{ inputs.ref_name }}
          REF_TYPE: ${{ inputs.ref_type }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          target="$RUST_TARGET"
          asset_version="$REF_NAME"
          binary="nemo-relay"
          if [ "$REF_TYPE" != "tag" ]; then
            asset_version="dev-${GIT_COMMIT::8}"
          fi
          asset="nemo-relay-cli-${target}-${asset_version}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            binary="${binary}.exe"
            asset="${asset}.exe"
          fi
          source="${NEMO_RELAY_CI_WORKSPACE}/target/${target}/release/${binary}"
          if [ ! -f "$source" ]; then
            echo "Error: expected CLI binary at ${source}" >&2
            exit 1
          fi
          rm -rf "${NEMO_RELAY_CI_WORKSPACE_TMP}/cli" "${NEMO_RELAY_CI_WORKSPACE_TMP}/cli-packages"
          mkdir -p "${NEMO_RELAY_CI_WORKSPACE_TMP}/cli" "${NEMO_RELAY_CI_WORKSPACE_TMP}/cli-packages"
          cp "$source" "${NEMO_RELAY_CI_WORKSPACE_TMP}/cli/${asset}"
          python scripts/package-cli-bin.py \
            --binary "$source" \
            --target "$target" \
            --version "$NEMO_RELAY_PACKAGE_VERSION" \
            --output-dir "${NEMO_RELAY_CI_WORKSPACE_TMP}/cli-packages"

      - name: Upload Rust CLI binary artifact
        id: rust-binary-upload
        if: ${{ always() && steps.package-version.outcome == 'success' && inputs.run_rust_package && steps.rust-stage.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cli-binary-${{ matrix.platform }}
          path: ${{ env.NEMO_RELAY_CI_WORKSPACE_TMP }}/cli/*
          if-no-files-found: error

      - name: Upload Rust CLI wheel artifact
        id: rust-wheel-upload
        if: ${{ always() && steps.package-version.outcome == 'success' && inputs.run_rust_package && steps.rust-stage.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cli-python-wheel-${{ matrix.platform }}
          path: ${{ env.NEMO_RELAY_CI_WORKSPACE_TMP }}/cli-packages/*.whl
          if-no-files-found: error

      - name: Report package results
        if: ${{ always() && !cancelled() }}
        env:
          HOMEBREW_CLEANUP: ${{ steps.homebrew-cleanup.outcome }}
          CHECKOUT: ${{ steps.checkout.outcome }}
          CI_CONFIG: ${{ steps.ci-config.outcome }}
          RUST_SETUP: ${{ steps.rust-setup.outcome }}
          RUST_CACHE: ${{ steps.rust-cache.outcome }}
          UV_SETUP: ${{ steps.uv-setup.outcome }}
          PYTHON_SETUP: ${{ steps.python-setup.outcome }}
          NODE_SETUP: ${{ steps.node-setup.outcome }}
          TOOLS_SETUP: ${{ steps.tools-setup.outcome }}
          PACKAGE_VERSION: ${{ steps.package-version.outcome }}
          PACKAGE_COMPILE: ${{ steps.package-compile.outcome }}
          RUN_PYTHON: ${{ inputs.run_python_package }}
          PYTHON_COMPILE: ${{ steps.package-compile.outputs.python }}
          PYTHON_UPLOAD: ${{ steps.python-upload.outcome }}
          PYTHON_SDIST_PACKAGE: ${{ steps.python-sdist-package.outcome }}
          PYTHON_SDIST_UPLOAD: ${{ steps.python-sdist-upload.outcome }}
          PYTHON_PLUGIN_PACKAGE: ${{ steps.python-plugin-package.outcome }}
          PYTHON_PLUGIN_UPLOAD: ${{ steps.python-plugin-upload.outcome }}
          MATURIN_VERSION: ${{ steps.maturin-version.outcome }}
          PYTHON_MUSL_VERIFY: ${{ steps.python-musl-verify.outcome }}
          PYTHON_MUSL_UPLOAD: ${{ steps.python-musl-upload.outcome }}
          UV_PRUNE: ${{ steps.uv-prune.outcome }}
          RUN_NODE: ${{ inputs.run_node_package }}
          NODE_TARGET: ${{ steps.node-target.outcome }}
          NODE_COMPILE: ${{ steps.package-compile.outputs.node }}
          NODE_UPLOAD: ${{ steps.node-upload.outcome }}
          RUN_OPENCLAW: ${{ inputs.run_openclaw }}
          OPENCLAW_COMPILE: ${{ steps.package-compile.outputs.openclaw }}
          OPENCLAW_UPLOAD: ${{ steps.openclaw-upload.outcome }}
          RUN_RUST: ${{ inputs.run_rust_package }}
          RUST_MUSL_TOOLS: ${{ steps.rust-musl-tools.outcome }}
          RUST_COMPILE: ${{ steps.package-compile.outputs.rust }}
          RUST_STAGE: ${{ steps.rust-stage.outcome }}
          RUST_BINARY_UPLOAD: ${{ steps.rust-binary-upload.outcome }}
          RUST_WHEEL_UPLOAD: ${{ steps.rust-wheel-upload.outcome }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          failed=false
          {
            printf '### Package results (%s)\n\n' "$PLATFORM"
            printf '| Operation | Result |\n|---|---|\n'
          } >> "$GITHUB_STEP_SUMMARY"

          report() {
            local enabled="$1"
            local name="$2"
            local result="${3:-skipped}"
            local expected="${4:-success}"
            if [[ "$enabled" != "true" ]]; then
              return
            fi
            printf '| %s | %s |\n' "$name" "${result:-skipped}" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$result" != "$expected" ]]; then
              echo "Error: ${name} finished with result '${result:-skipped}', expected ${expected}" >&2
              failed=true
            fi
          }

          report true "Checkout" "$CHECKOUT"
          if [[ "$PLATFORM" == "macos-arm64" ]]; then
            report true "Homebrew cleanup" "$HOMEBREW_CLEANUP"
          fi
          report true "CI configuration" "$CI_CONFIG"
          report true "Rust setup" "$RUST_SETUP"
          report true "Rust cache" "$RUST_CACHE"
          report true "uv setup" "$UV_SETUP"
          report true "Python setup" "$PYTHON_SETUP"
          report true "Packaging tools" "$TOOLS_SETUP"
          if [[ "$RUN_NODE" == "true" || "$RUN_OPENCLAW" == "true" ]]; then
            report true "Node.js setup" "$NODE_SETUP"
          fi
          report true "Package version" "$PACKAGE_VERSION"
          report true "Compile package artifacts" "$PACKAGE_COMPILE"
          report "$RUN_PYTHON" "Python compilation" "$PYTHON_COMPILE"
          if [[ "$PLATFORM" == *musl* ]]; then
            report "$RUN_PYTHON" "Maturin version" "$MATURIN_VERSION"
            report "$RUN_PYTHON" "Python musllinux tag" "$PYTHON_MUSL_VERIFY"
            report "$RUN_PYTHON" "Python musllinux upload" "$PYTHON_MUSL_UPLOAD"
          else
            report "$RUN_PYTHON" "Python wheel upload" "$PYTHON_UPLOAD"
          fi
          if [[ "$RUN_PYTHON" == "true" && "$PLATFORM" != *musl* ]]; then
            report true "uv cache prune" "$UV_PRUNE"
          fi
          if [[ "$PLATFORM" == "linux-amd64" ]]; then
            report "$RUN_PYTHON" "Python source package" "$PYTHON_SDIST_PACKAGE"
            report "$RUN_PYTHON" "Python source upload" "$PYTHON_SDIST_UPLOAD"
            report "$RUN_PYTHON" "Python plugin package" "$PYTHON_PLUGIN_PACKAGE"
            report "$RUN_PYTHON" "Python plugin upload" "$PYTHON_PLUGIN_UPLOAD"
          fi
          if [[ "$PLATFORM" == linux-* ]]; then
            report "$RUN_NODE" "Node.js Rust target" "$NODE_TARGET"
          fi
          report "$RUN_NODE" "Node.js compilation" "$NODE_COMPILE"
          report "$RUN_NODE" "Node.js upload" "$NODE_UPLOAD"
          if [[ "$PLATFORM" == "linux-amd64" ]]; then
            report "$RUN_OPENCLAW" "OpenClaw compilation" "$OPENCLAW_COMPILE"
            report "$RUN_OPENCLAW" "OpenClaw upload" "$OPENCLAW_UPLOAD"
          fi
          if [[ "$PLATFORM" == *musl* ]]; then
            report "$RUN_RUST" "Rust musl tools" "$RUST_MUSL_TOOLS"
          fi
          report "$RUN_RUST" "Rust compilation" "$RUST_COMPILE"
          report "$RUN_RUST" "Rust CLI staging" "$RUST_STAGE"
          report "$RUN_RUST" "Rust CLI binary upload" "$RUST_BINARY_UPLOAD"
          report "$RUN_RUST" "Rust CLI wheel upload" "$RUST_WHEEL_UPLOAD"

          if [[ "$failed" == "true" ]]; then
            exit 1
          fi
