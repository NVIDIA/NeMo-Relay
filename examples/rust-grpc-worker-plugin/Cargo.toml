[package]
name = "nemo-relay-rust-grpc-worker-plugin-example"
version.workspace = true
license.workspace = true
edition = "2024"
publish = false
description = "Complete Rust grpc-v1 worker example for NeMo Relay"

[dependencies]
futures-util = "0.3"
nemo-relay-worker.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
nemo-relay = { workspace = true, default-features = true, features = ["worker-grpc", "__skip-implicit-config"] }
sha2 = "0.11"
tempfile = "3"
toml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
uuid = { version = "1", features = ["v7"] }

[lib]
name = "nemo_relay_rust_grpc_worker_plugin_example"

[[bin]]
name = "nemo-relay-rust-grpc-worker-plugin-example"
path = "src/main.rs"
