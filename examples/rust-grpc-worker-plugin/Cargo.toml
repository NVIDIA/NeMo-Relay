[package]
name = "nemo-relay-rust-grpc-worker-plugin-example"
version.workspace = true
license.workspace = true
edition = "2024"
publish = false
description = "Complete Rust grpc-v1 worker example for NeMo Relay"

[dependencies]
# First-party crates.
nemo-relay-worker.workspace = true

# Third-party dependencies.
futures-util.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, default-features = true, features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
nemo-relay-runtime.workspace = true
# First-party crates.
nemo-relay = { workspace = true, default-features = true, features = ["worker-grpc", "__skip-implicit-config"] }

# Third-party dependencies.
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, default-features = true, features = ["macros", "rt-multi-thread", "sync"] }
toml.workspace = true
uuid = { workspace = true, features = ["v7"] }

[lib]
name = "nemo_relay_rust_grpc_worker_plugin_example"

[[bin]]
name = "nemo-relay-rust-grpc-worker-plugin-example"
path = "src/main.rs"
