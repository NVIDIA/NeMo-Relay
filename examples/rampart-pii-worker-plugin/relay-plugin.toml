manifest_version = 1

[plugin]
id = "nvidia.rampart_pii"
name = "Rampart PII"
version = "0.1.0"
kind = "worker"

[compat]
relay = ">=0.6,<1.0"
worker_protocol = "grpc-v1"

[defaults]
enabled = false

[capabilities]
items = ["plugin_worker", "config_schema"]

[config_schema]
path = "config.schema.json"

[source]
manifest_root = "."
artifact = "nemo_relay_rampart_worker/worker.py"

[integrity]
sha256 = "sha256:04225da0daae1fa06573f03181cda15c8b6534faf14c254a9e62cbcde3271a28"

[load]
runtime = "python"
entrypoint = "nemo_relay_rampart_worker.worker:main"
