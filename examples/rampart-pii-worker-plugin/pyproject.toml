[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nemo-relay-rampart-worker"
version = "0.1.0"
description = "Local Rampart PII sanitization worker for NeMo Relay"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "NVIDIA Corporation" },
]
dependencies = [
  "huggingface-hub>=0.36,<1",
  "nemo-relay-plugin>=0.6,<1.0",
  "numpy>=1.26,<3",
  "onnxruntime>=1.22,<2",
  "tokenizers>=0.21,<0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nemo_relay_rampart_worker"]

[tool.setuptools.package-data]
nemo_relay_rampart_worker = ["ATTRIBUTION.md"]
