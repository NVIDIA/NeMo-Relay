version = 1

[[components]]
kind = "switchyard"
enabled = true

[components.config]
version = 2
priority = 0
max_retries = 2
enabled_inbound_profiles = ["openai_chat"]

[components.config.algorithm]
kind = "random"
seed = 42

[components.config.default_targets]
openai_chat = "fast"

[components.config.targets.fast]
model = "provider/fast"
protocol = "openai_chat"
endpoint = "/v1/chat/completions"
base_url = "http://127.0.0.1:4101"
weight = 1

[components.config.targets.quality]
model = "provider/quality"
protocol = "openai_chat"
endpoint = "/v1/chat/completions"
base_url = "http://127.0.0.1:4101"
weight = 1
