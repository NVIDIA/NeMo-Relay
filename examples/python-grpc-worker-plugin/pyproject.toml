[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nemo-relay-python-grpc-worker-example"
version = "0.11.0"
license = "Apache-2.0"
description = "Example Python gRPC worker plugin for NeMo Relay"
requires-python = ">=3.11"
dependencies = [
  "nemo-relay-plugin>=0.11.0",
]

[dependency-groups]
test = [
  "pytest>=8",
  "pytest-asyncio>=0.26",
]

[tool.uv.sources]
nemo-relay-plugin = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nemo_relay_python_grpc_worker_example"]
