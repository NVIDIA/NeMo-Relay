[project]
name = "nemo-relay-python-language-binding-plugin-example"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "nemo-relay==0.8.0",
]

[dependency-groups]
test = [
  "pytest>=8",
  "pytest-asyncio>=0.26",
]

[tool.uv]
package = false

[tool.uv.sources]
nemo-relay = { path = "../../.." }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test_plugin.py"]
