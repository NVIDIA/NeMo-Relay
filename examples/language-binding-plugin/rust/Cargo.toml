[package]
name = "nemo-relay-language-binding-plugin-example"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
futures = "0.3"
nemo-relay = { version = "0.9.0", path = "../../../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
