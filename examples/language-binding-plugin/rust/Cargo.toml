[package]
name = "nemo-relay-language-binding-plugin-example"
version.workspace = true
license.workspace = true
edition = "2024"
publish = false

[dependencies]
nemo-relay-plugin-host.workspace = true
nemo-relay-runtime.workspace = true
# First-party crates.
nemo-relay = { workspace = true }

# Third-party dependencies.
futures.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, default-features = true, features = ["macros", "rt-multi-thread", "sync"] }
