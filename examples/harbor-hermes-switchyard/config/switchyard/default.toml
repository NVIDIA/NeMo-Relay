schema_version = 1

[llm_clients.nvidia]
format = "openai_chat"
base_url = "https://inference-api.nvidia.com/v1"
api_key_env = "SWITCHYARD_PROVIDER_AUTHORIZATION"

[targets.strong]
id = "aws/anthropic/bedrock-claude-opus-4-8"
llm_client = "nvidia"

[targets.weak]
id = "nvidia/nvidia/nemotron-3-ultra-nvfp4"
llm_client = "nvidia"

[targets.judge]
id = "aws/anthropic/bedrock-claude-sonnet-4-6"
llm_client = "nvidia"

[routes.default]
id = "ollama-route-stub"
type = "stage_router"
capable_target = "strong"
efficient_target = "weak"
picker = "efficient_first"
confidence_threshold = 0.5
recent_turn_window = 3

[routes.default.classifier]
target = "judge"
base_threshold = 0.5
threshold_step = 0.0
recent_turn_window = 3
