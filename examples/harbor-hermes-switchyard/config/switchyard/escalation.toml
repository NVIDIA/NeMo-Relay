schema_version = 1

[llm_clients.nvidia]
format = "openai_chat"
base_url = "https://inference-api.nvidia.com/v1"
api_key_env = "SWITCHYARD_PROVIDER_AUTHORIZATION"

[targets.strong]
id = "aws/anthropic/bedrock-claude-opus-4-8"
llm_client = "nvidia"

[targets.weak]
id = "nvidia/nvidia/nemotron-3-ultra-nvfp4"
llm_client = "nvidia"

[targets.judge]
id = "aws/anthropic/bedrock-claude-sonnet-4-6"
llm_client = "nvidia"

[routes.default]
id = "ollama-route-stub"
type = "llm_classifier"
mode = "escalation"
classifier_target = "judge"
weak_target = "weak"
strong_target = "strong"
max_output_tokens = 4096

[routes.default.escalation]
confirmations = 1
recent_turn_window = 28
window_message_chars = 500
