schema_version = 1

[llm_clients.nvidia]
format = "openai_chat"
base_url = "https://inference-api.nvidia.com/v1"
api_key_env = "SWITCHYARD_PROVIDER_AUTHORIZATION"

[targets.strong]
id = "openai/openai/gpt-5.6-sol"
llm_client = "nvidia"

[targets.weak]
id = "nvidia/deepseek-ai/deepseek-v4-flash"
llm_client = "nvidia"

[targets.weak.extra_body.reasoning]
enabled = false

[targets.judge]
id = "nvidia/deepseek-ai/deepseek-v4-flash"
llm_client = "nvidia"

[targets.judge.extra_body.reasoning]
enabled = false

[routes.default]
id = "ollama-route-stub"
type = "stage_router"
capable_target = "strong"
efficient_target = "weak"
picker = "capable_first"
confidence_threshold = 0.3
recent_turn_window = 3

[routes.default.classifier]
target = "judge"
base_threshold = 0.5
threshold_step = 0.0
recent_turn_window = 3
