[package]
name = "nemo-relay-rust-native-plugin-example"
version.workspace = true
license.workspace = true
edition = "2024"
publish = false
description = "Example Rust native dynamic plugin for NeMo Relay"

[lib]
name = "nemo_relay_rust_native_plugin_example"
crate-type = ["cdylib", "rlib"]

[dependencies]
# First-party crates.
nemo-relay-plugin.workspace = true

# Third-party dependencies.
futures.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, default-features = true, features = ["io-util", "macros", "time"] }

[dev-dependencies]
# First-party crates.
nemo-relay-plugin-host = { workspace = true, features = ["__skip-implicit-config"] }
nemo-relay-runtime.workspace = true

# Third-party dependencies.
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, default-features = true, features = ["macros", "rt-multi-thread", "sync"] }
toml.workspace = true
