[package]
name = "nemo-relay-rust-native-plugin-example"
version = "0.1.0"
edition = "2024"
publish = false
description = "Example Rust native dynamic plugin for NeMo Relay"

[workspace]

[lib]
name = "nemo_relay_rust_native_plugin_example"
crate-type = ["cdylib", "rlib"]

[dependencies]
futures = "0.3"
nemo-relay-plugin = { version = "0.9.0", path = "../../crates/plugin" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "time"] }

[dev-dependencies]
nemo-relay = { version = "0.9.0", path = "../../crates/core" }
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
