[workspace]
members = [
    "crates/core",
    "crates/runtime",
    "crates/codecs",
    "crates/types",
    "crates/model-pricing",
    "crates/resource-metrics",
    "crates/observability",
    "crates/plugin",
    "crates/worker-proto",
    "crates/worker",
    "crates/adaptive",
    "crates/pii-redaction",
    "crates/cli",
    # Language Bindings
    "crates/python",
    "crates/ffi",
    "crates/node",
    # Unpublished examples, test fixtures, and benchmark tools share Cargo.lock.
    "crates/runtime/tests/fixtures/native_plugin",
    "crates/runtime/tests/fixtures/worker_plugin",
    "examples/rust-native-plugin",
    "examples/rust-grpc-worker-plugin",
    "examples/language-binding-plugin/rust",
    "scripts/latency_benchmark/daemon_transport",
]
default-members = [
    "crates/core",
    "crates/types",
    "crates/model-pricing",
    "crates/resource-metrics",
    "crates/observability",
    "crates/plugin",
    "crates/worker-proto",
    "crates/worker",
    "crates/adaptive",
    "crates/pii-redaction",
    "crates/cli",
    "crates/python",
    "crates/ffi",
    "crates/node",
]
exclude = [".tmp", ".uv-cache"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/NVIDIA/NeMo-Relay"

[workspace.dependencies]
# Centralize versions and default-feature policy here. Select features and optional
# dependencies in each member to avoid enabling capabilities for unrelated crates.

# First-party crates (versions are updated by `just set-version`).
nemo-relay-codecs = { version = "1.0.0", path = "crates/codecs" }
nemo-relay-runtime = { version = "1.0.0", path = "crates/runtime" }
nemo-relay = { version = "1.0.0", path = "crates/core" }
nemo-relay-adaptive = { version = "1.0.0", path = "crates/adaptive" }
nemo-relay-cli = { version = "1.0.0", path = "crates/cli" }
nemo-relay-ffi = { version = "1.0.0", path = "crates/ffi" }
nemo-relay-pii-redaction = { version = "1.0.0", path = "crates/pii-redaction" }
nemo-relay-resource-metrics = { version = "1.0.0", path = "crates/resource-metrics" }
nemo-relay-observability = { version = "1.0.0", path = "crates/observability" }
nemo-relay-model-pricing = { version = "1.0.0", path = "crates/model-pricing" }
nemo-relay-plugin = { version = "1.0.0", path = "crates/plugin" }
nemo-relay-types = { version = "1.0.0", path = "crates/types" }
nemo-relay-worker = { version = "1.0.0", path = "crates/worker" }
nemo-relay-worker-proto = { version = "1.0.0", path = "crates/worker-proto" }

# Async runtime and concurrency.
async-stream = "0.3"
async-trait = "0.1"
futures = "0.3"
futures-util = "0.3"
stacker = "0.1"
tokio = { version = "1.53.3", default-features = false }
tokio-stream = { version = "0.1", default-features = false }
tokio-util = "0.7"

# HTTP, gRPC, networking, and TLS.
axum = "0.8"
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = "1.11.1"
hyper-rustls = { version = "0.27", default-features = false }
hyper-util = "0.1"
listeners = "0.4"
percent-encoding = "2"
prost = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3.2.0"
rcgen = "0.13"
reqwest = { version = "0.13", default-features = false }
ring = ">=0.17.13, <0.18"
rustls = { version = "0.23", default-features = false }
subtle = "2"
tokio-rustls = { version = "0.26", default-features = false }
tokio-tungstenite = { version = "0.29", default-features = false }
tonic = { version = "0.14.2", default-features = false }
tonic-prost = "0.14.2"
tonic-prost-build = "0.14.2"
tower = "0.5"
tower-service = "0.3"

# Data models, serialization, configuration, and validation.
arrayvec = { version = "0.7", default-features = false }
bitflags = "2"
chrono = { version = "0.4", default-features = false }
circular-buffer = "2.0.1"
enumset = { version = "1", default-features = false }
jsonschema = { version = "0.46.6", default-features = false }
regex = "1"
schemars = "0.8"
semver = "1"
serde = "1"
serde-saphyr = "1.3"
serde_json = "1"
serde_json_canonicalizer = "0.3"
strum = "0.27"
toml = "0.9"
toml_edit = "0.23"
typed-builder = "0.23.2"
unicode-general-category = "1.1"
uuid = "=1.18.1"

# Logging, telemetry, and adaptive storage.
log = "0.4"
object_store = { version = "0.14.1", default-features = false }
opentelemetry = { version = "0.33", default-features = false }
opentelemetry-http = "0.33"
opentelemetry-otlp = { version = "0.33.1", default-features = false }
opentelemetry-proto = { version = "0.33", default-features = false }
opentelemetry-semantic-conventions = { version = "0.33", default-features = false }
opentelemetry_sdk = { version = "0.33", default-features = false }
redis = "1.1"
spdlog-rs = "0.5"
tdigest = "0.2"
tracing = { version = "0.1", default-features = false }

# CLI, filesystem, archives, and hashing.
anyhow = "1"
base64 = "0.22"
clap = "4"
clap_complete = "4"
console = "0.16"
const-hex = "1"
dialoguer = { version = "0.12", default-features = false }
dotenvy = "0.15.7"
flate2 = "1"
fs2 = "0.4"
libloading = "0.8"
sha2 = "0.11"
shell-words = "1"
tar = "0.4"
tempfile = "3"
thiserror = "2"
zip = { version = "9.0.4", default-features = false }
zstd = "0.14.3"

# Platform APIs and system information.
libc = "0.2"
rustix = "1.1.4"
sysinfo = { version = "0.39.6", default-features = false }
windows-sys = "0.61"

# Language bindings and binding generation.
cbindgen = "0.29.2"
napi = "2"
napi-build = "2"
napi-derive = "2"
pyo3 = "0.29.0"
pyo3-async-runtimes = "0.29.0"
pythonize = "0.29.0"

# Benchmarking and test tooling.
hdrhistogram = "7"
syn = "2"

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
cognitive_complexity = "deny"

# Release artifacts are distributed in Python wheels, split Node.js packages,
# and as standalone CLI binaries. Thin LTO with size optimization is the first
# profile that keeps symbols and panic unwinding while meeting the distribution
# size budget.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "unwind"

# Rust 1.96.1's debug stripping can misalign Mach-O dylib string tables on macOS.
# Keep the FFI library linkable and loadable: rust-lang/rust#157750.
[profile.release.package.nemo-relay-ffi]
strip = "none"

# Preserve the transport driver's throughput-oriented release settings.
[profile.daemon-transport]
inherits = "release"
opt-level = 3
codegen-units = 16
strip = "none"
debug = "line-tables-only"
lto = "thin"
