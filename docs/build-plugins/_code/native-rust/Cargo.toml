[package]
name = "nemo-relay-rust-native-plugin-example"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
futures = "0.3"
nemo-relay-plugin = { version = "1.0.0", path = "../../crates/plugin" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "time"] }
