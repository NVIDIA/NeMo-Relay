codecov:
  require_ci_to_pass: true
  notify:
    manual_trigger: true
    wait_for_ci: true

coverage:
  round: nearest
  precision: 2
  range: "94...100"
  status:
    project:
      default:
        target: 88%
        threshold: 0.5%
        base: auto
        if_ci_failed: error
    patch:
      default:
        target: 90%
        threshold: 5%
        base: auto
        if_ci_failed: error

flag_management:
  default_rules:
    carryforward: true

component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        threshold: 0.5%
        base: auto
        if_ci_failed: error
  individual_components:
    - component_id: rust_runtime
      name: Rust Runtime
      paths:
        - "crates/sdk/src"
        - "crates/runtime/src"
        - "crates/codecs/src"
        - "crates/diagnostics/src"
        - "crates/logging/src"
        - "crates/builtins/src"
        - "crates/model-pricing/src"
        - "crates/resource-metrics/src"
        - "crates/observability/src"
        - "crates/adaptive/src"
    - component_id: shared_types
      name: Shared DTO Types
      paths:
        - "crates/types/src"
    - component_id: cli
      name: CLI
      paths:
        - "crates/cli/src"
    - component_id: go_binding
      name: Go Binding
      paths:
        - "go/nemo_relay"
        - "crates/ffi/src"
    - component_id: python_binding
      name: Python Binding
      paths:
        - "python/nemo_relay"
        - "crates/python/src"
    - component_id: node_binding
      name: Node Binding
      paths:
        - "crates/node/*.js"
    - component_id: plugin_sdk
      name: Dynamic Plugin SDKs
      paths:
        - "crates/types/src"
        - "crates/plugin/src"
        - "crates/plugin-host/src"
        - "crates/worker-proto/src"
        - "crates/worker/src"
        - "python/plugin/src/nemo_relay_plugin"

comment:
  layout: "header, diff, components, files, footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: false

github_checks:
  annotations: false

ignore:
  # Paths without coverage reports. Empty uploads pass when changed files match
  # this list or Codecov's non-testable types.
  - "docs/**"
  - "fern/**"
  - ".agents/**"
  - ".claude/**"
  - ".claude-plugin/**"
  - "scripts/**"
  - "install.*"
  - "uninstall.*"
  - "LICENSE*"
  - "**/*.mdx"
  - "**/*.toml"
  - "**/*.lock"
  - "**/*.json"
  - "**/examples/**"
  - "**/tests/**"
  - "crates/cli/tests/"
  # CLI TTY shells are exercised by smoke tests, while deterministic state,
  # validation, and persistence behavior remains in the CLI component.
  - "crates/cli/src/commands/configure/editor/prompt.rs"
  - "crates/cli/src/commands/configure/wizard/prompt.rs"
  - "crates/cli/src/plugins/prompt.rs"
  - "crates/cli/src/plugins/dynamic_editor/prompt.rs"
  - "**/tests-js/**"
  # The Node binding currently reports JS package coverage separately; exclude the
  # native Rust bridge until we have direct Rust-side coverage for this crate.
  - "crates/node/src/"
  - "crates/node/coverage/"
  - "target/"
  - "**/*.d.ts"
  - "**/*.pyi"
  - "python/plugin/src/nemo_relay_plugin/_proto/**"
  - "python/nemo_relay/lib_native*.dylib.dSYM/**"
